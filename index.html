    </div>

    <script>
        (function () {
            // Countdown: 25 April 2027, 15:30 South African time
            var target = new Date('2027-04-25T15:30:00+02:00').getTime();
            var els = { d: document.getElementById('cd-days'), h: document.getElementById('cd-hours'), m: document.getElementById('cd-mins'), s: document.getElementById('cd-secs') };
            var pad = function (n) { return String(n).padStart(2, '0'); };
            var timer;
            function tick() {
                var diff = target - Date.now();
                if (diff <= 0) {
                    clearInterval(timer);
                    document.getElementById('countdown').innerHTML = '<div class="done">Just married</div>';
                    return;
                }
                els.d.textContent = pad(Math.floor(diff / 86400000));
                els.h.textContent = pad(Math.floor(diff / 3600000) % 24);
                els.m.textContent = pad(Math.floor(diff / 60000) % 60);
                els.s.textContent = pad(Math.floor(diff / 1000) % 60);
            }
            tick();
            timer = setInterval(tick, 1000);

            // Wires up the full site. Runs once the private content is in the page.
            function initSite() {
                rsvpApp = document.getElementById('rsvpApp');

                // Nav turns solid once the cover has scrolled away
                var nav = document.getElementById('nav');
                if ('IntersectionObserver' in window) {
                    new IntersectionObserver(function (entries) {
                        nav.classList.toggle('solid', !entries[0].isIntersecting);
                    }, { rootMargin: '-64px 0px 0px 0px' }).observe(document.getElementById('home'));
                }

                // Full-screen menu
                var overlay = document.getElementById('overlay');
                var openBtn = document.getElementById('menuOpen');
                overlay.querySelectorAll('.overlay-links li').forEach(function (li, i) { li.style.setProperty('--i', i); });
                function setMenu(open) {
                    overlay.classList.toggle('open', open);
                    overlay.setAttribute('aria-hidden', String(!open));
                    openBtn.setAttribute('aria-expanded', String(open));
                    document.body.classList.toggle('menu-open', open);
                    if (open) overlay.querySelector('.overlay-links a').focus({ preventScroll: true });
                    else openBtn.focus({ preventScroll: true });
                }
                openBtn.addEventListener('click', function () { setMenu(true); });
                document.getElementById('menuClose').addEventListener('click', function () { setMenu(false); });
                overlay.querySelectorAll('a').forEach(function (a) { a.addEventListener('click', function () { setMenu(false); }); });
                document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && overlay.classList.contains('open')) setMenu(false); });

                // Scroll reveal
                var reveals = document.querySelectorAll('.reveal');
                if ('IntersectionObserver' in window) {
                    var io = new IntersectionObserver(function (entries) {
                        entries.forEach(function (e) {
                            if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); }
                        });
                    }, { rootMargin: '0px 0px -8% 0px', threshold: 0.08 });
                    reveals.forEach(function (el) { io.observe(el); });
                } else {
                    reveals.forEach(function (el) { el.classList.add('in'); });
                }

                // Initials for portraits without a photo
                document.querySelectorAll('.member').forEach(function (m) {
                    var p = m.querySelector('.portrait');
                    if (!p || p.querySelector('img')) return;
                    var name = m.querySelector('.m-name').textContent.trim();
                    p.dataset.initials = name.split(/\s+/).map(function (w) { return w[0]; }).slice(0, 2).join('');
                });

                // Style guide modal
                var modal = document.getElementById('styleGuide');
                document.querySelectorAll('[data-open-modal]').forEach(function (b) {
                    b.addEventListener('click', function () { modal.showModal(); });
                });
                modal.querySelector('[data-close-modal]').addEventListener('click', function () { modal.close(); });
                modal.addEventListener('click', function (e) { if (e.target === modal) modal.close(); });

                // Copy bank details
                document.querySelectorAll('[data-copy]').forEach(function (btn) {
                    btn.addEventListener('click', function () {
                        var text = btn.dataset.copy;
                        var done = function () {
                            btn.textContent = 'Copied';
                            btn.classList.add('done');
                            setTimeout(function () { btn.textContent = 'Copy'; btn.classList.remove('done'); }, 1800);
                        };
                        if (navigator.clipboard && window.isSecureContext) {
                            navigator.clipboard.writeText(text).then(done, fallback);
                        } else {
                            fallback();
                        }
                        function fallback() {
                            var t = document.createElement('textarea');
                            t.value = text;
                            t.setAttribute('readonly', '');
                            t.style.cssText = 'position:fixed;opacity:0';
                            document.body.appendChild(t);
                            t.select();
                            document.execCommand('copy');
                            t.remove();
                            done();
                        }
                    });
                });
            }

            // RSVP — personal links look like teliciajarrod.com/?invite=CODE
            // Paste the Google Apps Script web app URL (ends in /exec) here to switch RSVPs on.
            var RSVP_ENDPOINT = 'https://script.google.com/macros/s/AKfycbyinQ-3JaQqG4m9UJAm3d2eN2lzKSMWaDeW3NUkEY9FM4oy3LbTDbwJpCfqszZfyY4whw/exec';

            var params = new URLSearchParams(location.search);
            var inviteCode = (params.get('invite') || '').trim();
            var isLocal = /^(localhost|127\.0\.0\.1)$/.test(location.hostname);
            var api = (isLocal && params.get('api')) || RSVP_ENDPOINT;
            var rsvpApp;
            var rsvp = null;
            var rsvpNotice = '';

            // Soft nudge: a dismissible reminder under the nav, and a dot on the nav's RSVP pill,
            // shown only while this guest hasn't replied yet (and RSVPs are still open).
            var NUDGE_DISMISSED_KEY = 'jt-nudge-dismissed';
            function updateRsvpNudge() {
                var nudge = document.getElementById('rsvpNudge');
                var navRsvp = document.getElementById('navRsvp');
                if (!rsvp || !nudge || !navRsvp) return;
                var pending = !rsvp.invite.vendor && !rsvp.invite.responded && !rsvp.settings.closed;
                navRsvp.classList.toggle('pending', pending);
                var dismissed = false;
                try { dismissed = sessionStorage.getItem(NUDGE_DISMISSED_KEY) === '1'; } catch (e) {}
                var show = pending && !dismissed;
                nudge.hidden = !show;
                document.documentElement.classList.toggle('has-nudge', show);
            }
            (function () {
                var nudgeClose = document.getElementById('nudgeClose');
                if (!nudgeClose) return;
                nudgeClose.addEventListener('click', function () {
                    document.getElementById('rsvpNudge').hidden = true;
                    document.documentElement.classList.remove('has-nudge');
                    try { sessionStorage.setItem(NUDGE_DISMISSED_KEY, '1'); } catch (e) {}
                });
            })();

            // Sends to the RSVP script. When lots of guests send at once the script answers "busy"
            // (nothing saved), or Google returns an error page instead of JSON: wait and quietly try again.
            var RETRY_DELAYS = [2000, 4000, 8000];
            function postJson(payload, onRetry) {
                var attempt = 0;
                var send = function () {
                    return fetch(api, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload) })
                        .then(function (r) { return r.text(); })
                        .then(function (text) {
                            var d;
                            try { d = JSON.parse(text); } catch (e) { d = { ok: false, error: 'busy' }; }
                            if (d && d.error === 'busy' && attempt < RETRY_DELAYS.length) {
                                var wait = RETRY_DELAYS[attempt++] + Math.floor(Math.random() * 1000);
                                if (onRetry) onRetry(attempt);
                                return new Promise(function (done) { setTimeout(done, wait); }).then(send);
                            }
                            return d;
                        });
                };
                return send();
            }

            var esc = function (s) {
                return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
                    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
                });
            };

            function guestDetail(g) {
                if (g.attending !== 'Yes') return 'Regretfully declines';
                return ['Joyfully accepts', g.menu, g.dietary].filter(Boolean).map(esc).join(' · ');
            }

            // Vendors (planner, photographer, DJ…): a thank-you instead of the RSVP, their planning page and,
            // if they have it, the Darkroom. Guest-only parts (games, songs, registry, bar tab) are hidden.
            function renderVendor(inv) {
                var local = isLocal && params.get('api') ? '&api=' + encodeURIComponent(params.get('api')) : '';
                var planUrl = 'plan/?vendor=' + encodeURIComponent(inv.code) + local;
                var first = String(inv.name).split(' ')[0];
                document.querySelector('.scroll-cue').textContent = 'Welcome';
                document.getElementById('rsvpTitle').innerHTML = 'Thank <em>you</em>';
                var num = document.querySelector('#rsvp .sec-num');
                if (num) num.textContent = 'Nº 01 — Welcome';
                var html = '<p class="lede rsvp-greeting">Thank you, ' + esc(first) + '. You’re not just part of our day, you’re making it happen.</p>';
                if (inv.note) html += '<p class="rsvp-notice">' + esc(inv.note) + '</p>';
                html += '<div class="rsvp-actions"><a class="btn btn-solid" href="' + planUrl + '">Your planning page <span class="arrow">→</span></a>';
                if (inv.camera) html += '<a class="btn btn-ghost" href="camera/?invite=' + encodeURIComponent(inv.code) + local + '">Open the Darkroom <span class="arrow">→</span></a>';
                html += '<p class="fine">Everything below is what our guests see. Your planning page has the timings' + (inv.role ? ' and details for you as our ' + esc(inv.role.toLowerCase()) : '') + '.</p></div>';
                rsvpApp.innerHTML = html;
                ['games', 'darkroom', 'songs', 'registry', 'bartab'].forEach(function (id) {
                    var section = document.getElementById(id);
                    if (section) section.hidden = true;
                    var link = document.querySelector('#overlay a[href="#' + id + '"]');
                    if (link) link.parentNode.hidden = true;
                });
                var menuRsvp = document.querySelector('#overlay a[href="#rsvp"]');
                if (menuRsvp) menuRsvp.textContent = 'Thank you';
                var pill = document.getElementById('navRsvp');
                if (pill) { pill.href = planUrl; pill.classList.remove('pending'); pill.innerHTML = 'Planning'; }
                document.getElementById('rsvpNudge').hidden = true;
                document.documentElement.classList.remove('has-nudge');
            }

            function renderSummary() {
                var inv = rsvp.invite;
                var closed = rsvp.settings.closed;
                var anyYes = inv.guests.some(function (g) { return g.attending === 'Yes'; });
                var many = inv.guests.length > 1;
                var title;
                if (!inv.responded) title = 'Our RSVPs have now closed. If you still need to reply, please contact Jarrod or Telicia directly.';
                else if (anyYes) title = 'Thank you, ' + esc(inv.name) + '. We <em>can’t wait</em> to celebrate with you.';
                else title = 'Thank you for letting us know, ' + esc(inv.name) + '. You’ll be <em>missed</em>.';

                var html = '<p class="lede rsvp-greeting">' + title + '</p>';
                if (inv.responded) {
                    html += '<ul class="rsvp-summary">' + inv.guests.map(function (g) {
                        return '<li><b>' + esc(g.name) + '</b><span>' + guestDetail(g) + '</span></li>';
                    }).join('') + '</ul>';
                }
                html += '<div class="rsvp-actions">';
                if (anyYes) html += '<a href="#games" class="btn btn-solid">Play the wedding games <span class="arrow">→</span></a>' +
                    '<p class="fine games-hint">Tip: have a look through the website first. It’s full of hints and clues for the answers.</p>';
                if (!closed) html += '<button type="button" class="link" id="rsvpEdit">Change your reply</button>';
                if (!closed && rsvp.settings.deadline) html += '<p class="fine">Changes welcome until ' + esc(rsvp.settings.deadline) + '</p>';
                html += '</div>';
                rsvpApp.innerHTML = html;

                var edit = document.getElementById('rsvpEdit');
                if (edit) edit.addEventListener('click', renderForm);
            }

            function renderForm() {
                var inv = rsvp.invite;
                var s = rsvp.settings;
                if (s.closed) return renderSummary();
                var many = inv.guests.length > 1;

                var choice = function (i, value, label, current) {
                    return '<label><input type="radio" name="att-' + i + '" value="' + value + '"' + (current === value ? ' checked' : '') + '><span>' + label + '</span></label>';
                };

                var html = '<p class="lede rsvp-greeting">Dear ' + esc(inv.name) + ', we would love to celebrate with you. Kindly let us know if you can make it' +
                    (s.deadline ? ' by ' + esc(s.deadline) : '') + '.</p>';
                if (rsvpNotice) html += '<p class="rsvp-notice" role="status">' + rsvpNotice + '</p>';
                rsvpNotice = '';
                html += '<form id="rsvpForm" novalidate>';

                inv.guests.forEach(function (g, i) {
                    html += '<fieldset class="guest"><legend class="guest-name">' + esc(g.name) + '</legend>' +
                        '<div class="choice">' + choice(i, 'Yes', 'Joyfully accepts', g.attending) + choice(i, 'No', 'Regretfully declines', g.attending) + '</div>' +
                        '<div class="guest-extra"' + (g.attending === 'Yes' ? '' : ' hidden') + '>';
                    if (s.menuOptions.length) {
                        html += '<label class="field"><span class="eyebrow">Menu choice</span><select name="menu-' + i + '"><option value="">Choose a meal</option>' +
                            s.menuOptions.map(function (o) {
                                return '<option value="' + esc(o) + '"' + (o === g.menu ? ' selected' : '') + '>' + esc(o) + '</option>';
                            }).join('') + '</select></label>';
                    }
                    html += '<label class="field"><span class="eyebrow">Dietary requirements</span><input type="text" name="diet-' + i + '" maxlength="300" placeholder="Optional, e.g. vegetarian, nut allergy" value="' + esc(g.dietary) + '"></label>' +
                        '</div></fieldset>';
                });

                html += '<div class="rsvp-extras">' +
                    '<label class="field"><span class="eyebrow">A song that will get you dancing</span><input type="text" name="song" maxlength="200" placeholder="Optional" value="' + esc(inv.song) + '"></label>' +
                    '<label class="field"><span class="eyebrow">A note for the couple</span><textarea name="message" maxlength="1000" placeholder="Optional">' + esc(inv.message) + '</textarea></label>' +
                    '</div><p class="form-error" id="rsvpError" role="alert"></p>' +
                    '<div class="rsvp-actions"><button type="submit" class="btn btn-solid">Send ' + (many ? 'our' : 'my') + ' reply <span class="arrow">→</span></button></div></form>';

                rsvpApp.innerHTML = html;

                var form = document.getElementById('rsvpForm');
                var error = document.getElementById('rsvpError');

                form.addEventListener('change', function (e) {
                    error.textContent = '';
                    if (e.target.type !== 'radio') return;
                    var extra = e.target.closest('.guest').querySelector('.guest-extra');
                    extra.hidden = e.target.value !== 'Yes';
                });

                form.addEventListener('submit', function (e) {
                    e.preventDefault();
                    error.textContent = '';
                    var guests = inv.guests.map(function (g, i) {
                        var picked = form.querySelector('input[name="att-' + i + '"]:checked');
                        var menu = form.elements['menu-' + i];
                        return { name: g.name, attending: picked ? picked.value : '', menu: menu ? menu.value : '', dietary: form.elements['diet-' + i].value.trim() };
                    });

                    var missing = guests.filter(function (g) { return !g.attending; });
                    if (missing.length) {
                        error.textContent = 'Please let us know whether ' + missing.map(function (g) { return g.name; }).join(' and ') + (missing.length > 1 ? ' are' : ' is') + ' able to attend.';
                        return;
                    }
                    if (s.menuOptions.length && guests.some(function (g) { return g.attending === 'Yes' && !g.menu; })) {
                        error.textContent = 'Please choose a meal for everyone attending.';
                        return;
                    }

                    var button = form.querySelector('button[type="submit"]');
                    var label = button.innerHTML;
                    button.disabled = true;
                    button.textContent = 'Sending…';

                    var payload = { code: inv.code, version: inv.version || '', guests: guests, song: form.elements.song.value.trim(), message: form.elements.message.value.trim() };
                    var sameAsSent = function (saved) {
                        return saved.message === payload.message && saved.song === payload.song && saved.guests.every(function (g, i) {
                            var mine = guests[i] || {};
                            return g.name === mine.name && g.attending === mine.attending && g.menu === (mine.attending === 'Yes' ? mine.menu : '') && g.dietary === (mine.attending === 'Yes' ? mine.dietary : '');
                        });
                    };
                    postJson(payload, function () { button.textContent = 'Still sending…'; })
                        .then(function (res) {
                            // A retry after a reply that did save comes back "changed" with exactly what we sent: that's a success
                            if (!res.ok && res.error === 'changed' && res.invite && sameAsSent(res.invite)) res = { ok: true, version: res.invite.version };
                            if (!res.ok && res.error === 'changed' && res.invite) {
                                // Someone else on this invite replied after this form was opened: show theirs, don't overwrite it
                                rsvp.invite = res.invite;
                                rsvpNotice = (res.invite.guests.length > 1 ? 'Someone else on your invitation sent a reply' : 'A reply for this invitation was sent') +
                                    ' while you had this page open, so we’ve loaded it below. Change anything you need and send again.';
                                renderForm();
                                updateRsvpNudge();
                                document.getElementById('rsvp').scrollIntoView({ behavior: 'smooth' });
                                return;
                            }
                            if (!res.ok) throw res;
                            inv.version = res.version || '';
                            inv.guests = guests;
                            inv.song = payload.song;
                            inv.message = payload.message;
                            inv.responded = true;
                            renderSummary();
                            updateRsvpNudge();
                            loadGames();
                            document.getElementById('rsvp').scrollIntoView({ behavior: 'smooth' });
                        })
                        .catch(function (err) {
                            button.disabled = false;
                            button.innerHTML = label;
                            var messages = {
                                closed: 'Our RSVPs have now closed. Please contact Jarrod or Telicia directly.',
                                incomplete: 'Please answer for every guest before sending.',
                                busy: 'We’re getting a lot of replies right now. Please wait a minute and try again.',
                                not_found: 'We couldn’t find your invitation. Please use the link from your message.'
                            };
                            error.textContent = (err && messages[err.error]) || 'We couldn’t send your reply. Please check your connection and try again.';
                        });
                });
            }

            // ---------- Wedding games ----------
            // Questions come from the script with no answers. Only guests who RSVP'd yes can play, once per game.
            var games = null;
            var gamePlayer = '';
            var gameTimer = null;
            var GAME_ERRORS = {
                busy: 'We’re getting a lot of replies right now. Please wait a minute and try again.',
                closed: 'The games have closed. The winners are announced at the reception.',
                rsvp_first: 'Please RSVP that you’re joining us first, then come back to play.',
                already_played: 'You’ve already played this one.',
                incomplete: 'Please answer every question.',
                not_started: 'Something went wrong starting the quiz. Please refresh and try again.',
                not_found: 'We couldn’t find your invitation. Please use the link from your message.'
            };
            // (postJson is defined with the RSVP code above: it retries automatically when the server is busy)
            var gamesEl = function () { return document.getElementById('gamesApp'); };
            var currentPlayer = function () { return games.guests.filter(function (g) { return g.name === gamePlayer; })[0]; };
            var fmtSeconds = function (sec) { var m = Math.floor(sec / 60), s = sec % 60; return (m ? m + 'm ' : '') + s + 's'; };
            var stopTimer = function () { if (gameTimer) { clearInterval(gameTimer); gameTimer = null; } };
            var toGames = function () { document.getElementById('games').scrollIntoView({ behavior: 'smooth' }); };

            function loadGames() {
                if (!code || !api || !gamesEl()) return;
                fetch(api + '?action=games&code=' + encodeURIComponent(code))
                    .then(function (r) { return r.json(); })
                    .then(function (d) {
                        if (!d.ok) return;
                        games = d;
                        var still = d.guests.some(function (g) { return g.name === gamePlayer; });
                        if (!still) gamePlayer = (d.guests.filter(function (g) { return g.canPlay; })[0] || d.guests[0]).name;
                        renderGames();
                    })
                    .catch(function () {});
            }

            function renderGames() {
                stopTimer();
                var p = currentPlayer();
                var html = '';
                if (games.guests.length > 1) {
                    html += '<div class="game-who"><span class="eyebrow">Who’s playing?</span><div class="choice">' + games.guests.map(function (g) {
                        return '<label><input type="radio" name="gamePlayer" value="' + esc(g.name) + '"' + (g.name === gamePlayer ? ' checked' : '') + '><span>' + esc(g.name) + '</span></label>';
                    }).join('') + '</div></div>';
                }
                if (!p.canPlay) {
                    html += '<p class="lede">The games are for guests joining us on the day. <a href="#rsvp">RSVP</a> that you’re coming, then come back to play.</p>';
                } else {
                    var q = p.quiz, pr = p.predictions;
                    var quiz = '<div class="game-card"><span class="eyebrow">Game one</span><h3>How well do you know <em>us</em>?</h3>';
                    if (q.done) {
                        quiz += '<p class="game-score">' + q.score + '/' + q.total + '</p><p class="fine">in ' + fmtSeconds(q.seconds) + '</p>' +
                            '<button type="button" class="link" data-game-review="quiz">See the answers</button>';
                    } else if (!games.open) {
                        quiz += '<p class="fine">The quiz has closed.</p>';
                    } else {
                        quiz += '<p>' + games.games.quiz.length + ' questions. Most right answers wins, and you’re timed, so the fastest breaks a tie. The answers are revealed when you finish.</p>' +
                            '<button type="button" class="btn btn-solid" data-game-play="quiz">' + (q.started ? 'Carry on (the clock is running)' : 'Start the quiz') + ' <span class="arrow">→</span></button>';
                    }
                    quiz += '</div>';
                    var pred = '<div class="game-card"><span class="eyebrow">Game two</span><h3>Predict the <em>day</em></h3>';
                    if (pr.done) {
                        pred += '<p class="game-score">Locked in</p><p class="fine">Scored on the wedding day</p>' +
                            '<button type="button" class="link" data-game-review="predictions">See my predictions</button>';
                    } else if (!games.open) {
                        pred += '<p class="fine">Predictions have closed.</p>';
                    } else {
                        pred += '<p>' + games.games.predictions.length + ' guesses about how the day will go. We find out who was right at the reception.</p>' +
                            '<button type="button" class="btn btn-solid" data-game-play="predictions">Make my predictions <span class="arrow">→</span></button>';
                    }
                    pred += '</div>';
                    html += '<div class="game-cards">' + quiz + pred + '</div>';
                    html += '<p class="fine games-note">One go per guest' + (games.close ? ', open until ' + esc(games.close) : '') + '. Winners are announced at the reception.</p>';
                }
                html += '<p class="form-error" id="gameError" role="alert"></p>';
                gamesEl().innerHTML = html;

                gamesEl().querySelectorAll('input[name="gamePlayer"]').forEach(function (r) {
                    r.addEventListener('change', function () { gamePlayer = r.value; renderGames(); });
                });
                gamesEl().querySelectorAll('[data-game-play]').forEach(function (b) {
                    b.addEventListener('click', function () { playGame(b.getAttribute('data-game-play'), b); });
                });
                gamesEl().querySelectorAll('[data-game-review]').forEach(function (b) {
                    b.addEventListener('click', function () { renderReview(b.getAttribute('data-game-review')); });
                });
            }

            function showGameError(res) {
                var el = document.getElementById('gameError');
                if (el) el.textContent = (res && GAME_ERRORS[res.error]) || 'Something went wrong. Please check your connection and try again.';
            }

            function playGame(game, button) {
                if (game === 'predictions') return renderQuestions(game);
                button.disabled = true;
                postJson({ action: 'gameStart', code: code, guest: gamePlayer, game: game })
                    .then(function (res) {
                        if (!res.ok) { button.disabled = false; return showGameError(res); }
                        currentPlayer()[game] = res.entry;
                        renderQuestions(game);
                    })
                    .catch(function () { button.disabled = false; showGameError(); });
            }

            function renderQuestions(game) {
                stopTimer();
                var qs = games.games[game];
                var html = '<div class="game-play">';
                if (game === 'quiz') html += '<p class="game-timer" id="gameClock" aria-live="off">0s</p>';
                html += '<p class="lede review-head">' + esc(gamePlayer) + (game === 'quiz' ? ', how well do you know us?' : ', how will the day go?') + '</p><form id="gameForm" novalidate>';
                qs.forEach(function (q, i) {
                    html += '<fieldset class="game-q"><legend class="game-q-title"><span class="game-q-no">' + (game === 'quiz' ? 'Question ' : 'Prediction ') + (i + 1) + ' of ' + qs.length + '</span>' + esc(q.question) + '</legend>';
                    if (q.type === 'time') {
                        html += '<label class="field"><span class="eyebrow">Your time</span><input type="time" name="q-' + i + '" min="15:00" max="23:59"></label>';
                    } else {
                        html += '<div class="choice">' + q.options.map(function (o) {
                            return '<label><input type="radio" name="q-' + i + '" value="' + esc(o) + '"><span>' + esc(o) + '</span></label>';
                        }).join('') + '</div>';
                    }
                    html += '</fieldset>';
                });
                html += '<p class="form-error" id="gameError" role="alert"></p><div class="rsvp-actions">' +
                    '<button type="submit" class="btn btn-solid">Lock in my ' + (game === 'quiz' ? 'answers' : 'predictions') + ' <span class="arrow">→</span></button>' +
                    (game === 'predictions' ? '<button type="button" class="link" id="gameBack">Back to the games</button>' : '<p class="fine">No second chances: one go per guest.</p>') +
                    '</div></form></div>';
                gamesEl().innerHTML = html;
                toGames();

                if (game === 'quiz') {
                    var started = currentPlayer().quiz.startedAt || Date.now();
                    var clock = document.getElementById('gameClock');
                    var tick = function () { clock.textContent = fmtSeconds(Math.max(0, Math.round((Date.now() - started) / 1000))); };
                    tick();
                    gameTimer = setInterval(tick, 1000);
                }
                var back = document.getElementById('gameBack');
                if (back) back.addEventListener('click', function () { renderGames(); toGames(); });

                var form = document.getElementById('gameForm');
                form.addEventListener('change', function () { document.getElementById('gameError').textContent = ''; });
                form.addEventListener('submit', function (e) {
                    e.preventDefault();
                    var answers = qs.map(function (q, i) {
                        if (q.type === 'time') return form.elements['q-' + i].value;
                        var picked = form.querySelector('input[name="q-' + i + '"]:checked');
                        return picked ? picked.value : '';
                    });
                    var missing = answers.map(function (a, i) { return a ? 0 : i + 1; }).filter(Boolean);
                    if (missing.length) {
                        document.getElementById('gameError').textContent = 'Please answer ' + (missing.length === 1 ? 'number ' + missing[0] : 'numbers ' + missing.join(', ')) + '.';
                        return;
                    }
                    var button = form.querySelector('button[type="submit"]');
                    var label = button.innerHTML;
                    button.disabled = true;
                    button.textContent = 'Locking in…';
                    postJson({ action: 'gameSubmit', code: code, guest: gamePlayer, game: game, answers: answers })
                        .then(function (res) {
                            if (!res.ok) throw res;
                            stopTimer();
                            currentPlayer()[game] = res.entry;
                            renderReview(game);
                        })
                        .catch(function (err) {
                            button.disabled = false;
                            button.innerHTML = label;
                            showGameError(err);
                        });
                });
            }

            function renderReview(game) {
                stopTimer();
                var qs = games.games[game];
                var entry = currentPlayer()[game];
                var html = '';
                if (game === 'quiz') {
                    html += '<div class="review-head"><span class="eyebrow">' + esc(gamePlayer) + '</span><p class="game-score">' + entry.score + '/' + entry.total + '</p><p class="fine">in ' + fmtSeconds(entry.seconds) + '</p></div><ol class="review">';
                    qs.forEach(function (q, i) {
                        var mine = entry.answers[i], right = entry.correct[i];
                        var ok = right && mine === right;
                        html += '<li class="' + (ok ? 'right' : 'wrong') + '"><span class="q">' + (i + 1) + '. ' + esc(q.question) + '</span>' +
                            '<span class="mine"><span class="mark" aria-hidden="true">' + (ok ? '✓' : '✗') + '</span>' + esc(mine) + '</span>' +
                            (ok ? '' : '<span class="answer">Answer: ' + (right ? esc(right) : 'to be revealed') + '</span>') + '</li>';
                    });
                } else {
                    html += '<div class="review-head"><span class="eyebrow">' + esc(gamePlayer) + '’s predictions</span><p class="fine">Locked in. We find out who was right at the reception.</p></div><ol class="review">';
                    qs.forEach(function (q, i) {
                        html += '<li><span class="q">' + (i + 1) + '. ' + esc(q.question) + '</span><span class="mine">' + esc(entry.answers[i]) + '</span></li>';
                    });
                }
                html += '</ol><div class="rsvp-actions"><button type="button" class="link" id="gameBack">Back to the games</button></div>';
                gamesEl().innerHTML = html;
                document.getElementById('gameBack').addEventListener('click', function () { renderGames(); toGames(); });
                toGames();
            }

            // ---------- Song requests: search Spotify and add to the wedding playlist (3 songs per person) ----------
            var songs = null;
            var songPlayer = '';
            var SONG_ERRORS = {
                busy: 'We’re getting a lot of replies right now. Please wait a minute and try again.',
                limit: 'You’ve used all your song requests. Thank you!',
                already_added: 'Someone beat you to it: that one’s already on the playlist.',
                spotify_unavailable: 'Spotify isn’t answering right now. Please try again in a minute.',
                not_found: 'We couldn’t find your invitation. Please use the link from your message.'
            };
            var songGuest = function () { return songs.guests.filter(function (g) { return g.name === songPlayer; })[0]; };
            var songCountText = function () {
                var g = songGuest();
                var who = songs.guests.length > 1 ? esc(g.name.split(' ')[0]) + ', you' : 'You';
                if (g.unlimited) return who + ' can add as many songs as you like. It’s your playlist!';
                return g.left > 0 ? who + ' can add ' + g.left + ' more song' + (g.left === 1 ? '' : 's') : who + '’ve added all ' + songs.perGuest + ' songs. Thank you!';
            };
            function loadSongs() {
                var el = document.getElementById('songsApp');
                if (!code || !api || !el) return;
                fetch(api + '?action=songs&code=' + encodeURIComponent(code))
                    .then(function (r) { return r.json(); })
                    .then(function (d) {
                        if (!d.ok || !d.enabled || !d.guests || !d.guests.length) return;
                        songs = d;
                        if (!songs.guests.some(function (g) { return g.name === songPlayer; })) songPlayer = songs.guests[0].name;
                        var player = document.getElementById('songsPlayer');
                        var embed = 'https://open.spotify.com/embed/playlist/' + d.playlistId + '?utm_source=generator';
                        if (player && player.getAttribute('src') !== embed) player.setAttribute('src', embed);
                        var open = document.getElementById('songsOpen');
                        if (open) open.href = 'https://open.spotify.com/playlist/' + d.playlistId;
                        document.getElementById('songsIntro').textContent = 'Search for the anthems that will get you dancing and add them straight to our playlist: ' + d.perGuest + ' songs each, no Spotify account needed.';
                        el.hidden = false;
                        renderSongs();
                    })
                    .catch(function () {});
            }
            function renderSongs(results, message, q) {
                var el = document.getElementById('songsApp');
                var g = songGuest();
                var html = '';
                if (songs.guests.length > 1) {
                    html += '<div class="game-who"><span class="eyebrow">Who’s adding songs?</span><div class="choice">' + songs.guests.map(function (x) {
                        return '<label><input type="radio" name="songPlayer" value="' + esc(x.name) + '"' + (x.name === songPlayer ? ' checked' : '') + '><span>' + esc(x.name) + '</span></label>';
                    }).join('') + '</div></div>';
                }
                html += '<p class="fine songs-count">' + songCountText() + '</p>';
                if (g.left > 0) {
                    html += '<form class="song-search" id="songForm" novalidate><label class="field"><span class="eyebrow">Song or artist</span>' +
                        '<input type="search" name="q" maxlength="100" placeholder="e.g. September, Earth Wind &amp; Fire" autocomplete="off" value="' + esc(q || '') + '"></label>' +
                        '<button type="submit" class="btn btn-solid">Search</button></form>';
                }
                html += '<p class="form-error" id="songError" role="alert">' + (message ? esc(message) : '') + '</p>';
                if (results && results.length) {
                    html += '<ul class="song-results">' + results.map(function (t, i) {
                        // justAdded: this guest just added it. added: already on the playlist (anyone, any version)
                        var label = t.justAdded ? 'Added ✓' : t.added ? 'Already added' : 'Add';
                        return '<li>' + (t.image ? '<img src="' + esc(t.image) + '" alt="">' : '<span class="art"></span>') +
                            '<div><b>' + esc(t.name) + '</b><span>' + esc(t.artist) + '</span></div>' +
                            '<button type="button" class="btn btn-solid add" data-song="' + i + '"' + (g.left > 0 && !t.added ? '' : ' disabled') + '>' + label + '</button></li>';
                    }).join('') + '</ul>';
                } else if (results) {
                    html += '<p class="fine">No matches. Try the song title and artist.</p>';
                }
                if (g.mine.length) {
                    html += '<div class="song-mine"><span class="eyebrow">' + (songs.guests.length > 1 ? esc(g.name.split(' ')[0]) + '’s' : 'Your') + ' songs on the playlist</span><ul>' +
                        g.mine.map(function (m) { return '<li>' + esc(m.name) + ' · <span style="color:var(--muted)">' + esc(m.artist) + '</span></li>'; }).join('') + '</ul></div>';
                }
                el.innerHTML = html;

                el.querySelectorAll('input[name="songPlayer"]').forEach(function (r) {
                    r.addEventListener('change', function () { songPlayer = r.value; renderSongs(results, '', q); });
                });
                var form = document.getElementById('songForm');
                if (form) form.addEventListener('submit', function (e) {
                    e.preventDefault();
                    var query = form.elements.q.value.trim();
                    if (query.length < 2) return;
                    var button = form.querySelector('button');
                    button.disabled = true;
                    button.textContent = 'Searching…';
                    fetch(api + '?action=songSearch&code=' + encodeURIComponent(code) + '&q=' + encodeURIComponent(query))
                        .then(function (r) { return r.json(); })
                        .then(function (d) {
                            if (!d.ok) throw d;
                            renderSongs(d.results, '', query);
                        })
                        .catch(function (err) { renderSongs(null, (err && SONG_ERRORS[err.error]) || SONG_ERRORS.spotify_unavailable, query); });
                });
                el.querySelectorAll('[data-song]').forEach(function (b) {
                    b.addEventListener('click', function () {
                        var t = results[Number(b.getAttribute('data-song'))];
                        var guest = songGuest();
                        b.disabled = true;
                        b.textContent = 'Adding…';
                        postJson({ action: 'songAdd', code: code, guest: guest.name, trackId: t.id })
                            .then(function (res) {
                                if (typeof res.left === 'number') guest.left = res.left;
                                if (!res.ok) {
                                    if (res.error === 'already_added') t.added = true;
                                    renderSongs(results, SONG_ERRORS[res.error] || SONG_ERRORS.spotify_unavailable, q);
                                    return;
                                }
                                guest.mine.push(res.song);
                                t.added = true;
                                t.justAdded = true;
                                renderSongs(results, '', q);
                                // Refresh the player so the new song shows
                                var player = document.getElementById('songsPlayer');
                                if (player) player.setAttribute('src', player.getAttribute('src').split('&t=')[0] + '&t=' + Date.now());
                            })
                            .catch(function () { b.disabled = false; b.textContent = 'Add'; document.getElementById('songError').textContent = SONG_ERRORS.spotify_unavailable; });
                    });
                });
            }

            // ---------- Host page: teliciajarrod.com/?host=KEY (wedding day) ----------
            var hostKey = (params.get('host') || '').trim();
            function initHost() {
                document.body.classList.add('host-mode');
                var el = document.getElementById('hostApp');
                el.hidden = false;
                el.innerHTML = '<div class="wrap"><p class="fine">Loading the games…</p></div>';
                fetch(api + '?action=host&key=' + encodeURIComponent(hostKey))
                    .then(function (r) { return r.json(); })
                    .then(renderHost)
                    .catch(function () { el.innerHTML = '<div class="wrap"><p class="lede">Couldn’t load the games. Check the signal and refresh.</p></div>'; });
            }
            function renderHost(d) {
                var el = document.getElementById('hostApp');
                if (!d.ok) { el.innerHTML = '<div class="wrap"><p class="lede">This host link doesn’t work. Please check it with Jarrod.</p></div>'; return; }
                var row = function (cells, top) { return '<tr' + (top ? ' class="top"' : '') + '>' + cells.join('') + '</tr>'; };
                var who = function (e) { return '<td>' + esc(e.guest) + '<small>' + esc(e.invite) + '</small></td>'; };
                var html = '<div class="wrap"><span class="eyebrow" style="display:block;text-align:center">Host page · keep this link private</span><h1>The Wedding <em>Games</em></h1>';

                html += '<h2>Quiz champion</h2><p class="fine">Most right answers wins. A tie goes to whoever finished fastest.</p>';
                if (d.quizMissingAnswers) html += '<p class="host-warn">' + d.quizMissingAnswers + ' quiz question(s) have no answer set on the Game Setup tab, so nobody can score on them.</p>';
                html += d.leaderboards.quiz.length ? '<table class="board"><thead><tr><th>#</th><th>Guest</th><th class="num">Score</th><th class="num">Time</th></tr></thead><tbody>' +
                    d.leaderboards.quiz.slice(0, 10).map(function (e, i) {
                        return row(['<td>' + (i + 1) + '</td>', who(e), '<td class="num">' + e.score + '/' + d.quizTotal + '</td>', '<td class="num">' + fmtSeconds(e.seconds) + '</td>'], i === 0);
                    }).join('') + '</tbody></table>' : '<p class="fine">Nobody has played yet.</p>';

                html += '<h2>What really happened</h2><p class="fine">Fill these in as the night goes on and save. Leave anything you don’t know yet blank.</p><form id="hostForm" novalidate>';
                d.predictions.forEach(function (q, i) {
                    html += '<fieldset class="game-q"><legend class="game-q-title"><span class="game-q-no">Prediction ' + (i + 1) + '</span>' + esc(q.question) + '</legend>';
                    if (q.type === 'time') {
                        html += '<label class="field"><span class="eyebrow">Actual time</span><input type="time" name="r-' + i + '" value="' + esc(q.result) + '"></label>';
                    } else {
                        html += '<div class="choice">' + q.options.map(function (o) {
                            return '<label><input type="radio" name="r-' + i + '" value="' + esc(o) + '"' + (o === q.result ? ' checked' : '') + '><span>' + esc(o) + '</span></label>';
                        }).join('') + '</div>';
                    }
                    html += '</fieldset>';
                });
                html += '<p class="form-error" id="hostError" role="alert"></p><div class="rsvp-actions"><button type="submit" class="btn btn-solid">Save and rescore <span class="arrow">→</span></button></div></form>';

                html += '<h2>Best predictor</h2><p class="fine">Most right picks wins. A tie goes to whoever was closest on the two times (fewest minutes off in total).</p>';
                html += d.leaderboards.predictions.length ? '<table class="board"><thead><tr><th>#</th><th>Guest</th><th class="num">Right</th><th class="num">Minutes off</th></tr></thead><tbody>' +
                    d.leaderboards.predictions.slice(0, 10).map(function (e, i) {
                        return row(['<td>' + (i + 1) + '</td>', who(e), '<td class="num">' + e.score + '</td>', '<td class="num">' + e.minutesOff + '</td>'], i === 0);
                    }).join('') + '</tbody></table>' : '<p class="fine">Nobody has made predictions yet.</p>';

                // The Darkroom mission game: first to complete every mission wins
                var m = d.missions;
                if (m && m.total) {
                    var clock = function (iso) { return new Date(iso).toLocaleTimeString('en-ZA', { timeZone: 'Africa/Johannesburg', hour: '2-digit', minute: '2-digit', hour12: false }); };
                    html += '<h2>Darkroom mission champion</h2><p class="fine">The first guest to shoot all ' + m.total + ' photo missions wins. Times are when each photo was taken, so a phone that uploads late isn’t penalised. Refresh before you announce.</p>';
                    html += m.leaders.length ? '<table class="board"><thead><tr><th>#</th><th>Guest</th><th class="num">Missions</th><th class="num">Finished</th></tr></thead><tbody>' +
                        m.leaders.slice(0, 10).map(function (e, i) {
                            return row(['<td>' + (i + 1) + '</td>', who(e), '<td class="num">' + e.done + '/' + m.total + '</td>', '<td class="num">' + (e.finished ? clock(e.at) : '–') + '</td>'], i === 0 && e.finished);
                        }).join('') + '</tbody></table>' : '<p class="fine">Nobody has shot a mission yet.</p>';
                    html += '<h2>First on each mission</h2><table class="board"><tbody>' + m.firsts.map(function (f) {
                        return row(['<td>' + esc(f.mission) + '<small>' + (f.guest ? esc(f.guest) + ' · ' + esc(f.invite) : 'Not yet') + '</small></td>', '<td class="num">' + (f.at ? clock(f.at) : '') + '</td>']);
                    }).join('') + '</tbody></table>';
                }
                html += '<div class="rsvp-actions" style="margin-top:40px"><button type="button" class="link" id="hostRefresh">Refresh</button></div></div>';
                el.innerHTML = html;

                document.getElementById('hostRefresh').addEventListener('click', initHost);
                var form = document.getElementById('hostForm');
                form.addEventListener('submit', function (e) {
                    e.preventDefault();
                    var results = d.predictions.map(function (q, i) {
                        if (q.type === 'time') return form.elements['r-' + i].value;
                        var picked = form.querySelector('input[name="r-' + i + '"]:checked');
                        return picked ? picked.value : '';
                    });
                    var button = form.querySelector('button[type="submit"]');
                    button.disabled = true;
                    button.textContent = 'Saving…';
                    postJson({ action: 'hostResults', key: hostKey, results: results })
                        .then(function (res) {
                            if (!res.ok) throw res;
                            renderHost(res);
                            window.scrollTo({ top: 0, behavior: 'smooth' });
                        })
                        .catch(function () {
                            button.disabled = false;
                            button.textContent = 'Save and rescore';
                            document.getElementById('hostError').textContent = 'Couldn’t save. Check the signal and try again.';
                        });
                });
            }

            // Unlocking: only a valid invite code (or ?dev=unlock) opens the full site.
            // A code that worked is remembered on this device, so guests can come back via the plain address.
            var coverNote = document.getElementById('coverNote');
            var STORE_KEY = 'jt-invite';
            var storedCode = '';
            try { storedCode = localStorage.getItem(STORE_KEY) || ''; } catch (e) {}
            var code = inviteCode || storedCode;

            // In the published site the private content is encrypted (see rsvp/dev/build.js).
            // The Google script only hands the key to valid invite codes. The plain vault copy has no sealed blocks.
            var sealedBlocks = document.querySelectorAll('script[data-sealed]');
            var siteReady = false;
            var siteKey = null;

            function fromBase64(str) {
                return Uint8Array.from(atob(str), function (c) { return c.charCodeAt(0); });
            }

            function unseal(key) {
                if (!sealedBlocks.length) return Promise.resolve();
                if (!key || !window.crypto || !crypto.subtle) return Promise.reject(new Error('no_key'));
                return crypto.subtle.importKey('raw', fromBase64(key), 'AES-GCM', false, ['decrypt']).then(function (k) {
                    siteKey = k;
                    return Promise.all([].map.call(sealedBlocks, function (el) {
                        return crypto.subtle.decrypt({ name: 'AES-GCM', iv: fromBase64(el.dataset.iv) }, k, fromBase64(el.textContent.trim()))
                            .then(function (buf) {
                                el.insertAdjacentHTML('beforebegin', new TextDecoder().decode(buf));
                                el.remove();
                            });
                    }));
                });
            }

            // Photos are separate encrypted files ([12-byte IV][ciphertext]); fetched only once unlocked
            function loadPhotos() {
                if (!siteKey) return;
                document.querySelectorAll('img[data-photo]').forEach(function (img) {
                    fetch(img.getAttribute('data-photo'))
                        .then(function (r) { return r.arrayBuffer(); })
                        .then(function (buf) {
                            var bytes = new Uint8Array(buf);
                            return crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes.slice(0, 12) }, siteKey, bytes.slice(12));
                        })
                        .then(function (plain) { img.src = URL.createObjectURL(new Blob([plain], { type: 'image/jpeg' })); })
                        .catch(function () {});
                });
            }

            function openSite() {
                if (!siteReady) { siteReady = true; initSite(); loadPhotos(); }
                document.body.classList.remove('locked');
            }

            // ?dev=unlock previews the plain (unencrypted) copy only
            if (params.get('dev') === 'unlock' && !sealedBlocks.length) openSite();

            if (hostKey && api) initHost();
            else if (code && api) {
                if (inviteCode) coverNote.textContent = 'Opening your invitation\u2026';
                fetch(api + '?action=lookup&code=' + encodeURIComponent(code))
                    .then(function (r) { return r.json(); })
                    .then(function (data) {
                        if (!data.ok) {
                            if (inviteCode) {
                                coverNote.textContent = 'We couldn\u2019t find that invitation. Please open the link from your message.';
                            } else {
                                try { localStorage.removeItem(STORE_KEY); } catch (e) {}
                            }
                            return;
                        }
                        return unseal(data.key).then(function () {
                            openSite();
                            try { localStorage.setItem(STORE_KEY, data.invite.code); } catch (e) {}
                            rsvp = data;
                            // The Darkroom button opens this guest's own camera (works even where the phone can't remember the invite)
                            var darkroom = document.getElementById('darkroomLink');
                            if (darkroom) darkroom.href = 'camera/?invite=' + encodeURIComponent(data.invite.code) + (isLocal && params.get('api') ? '&api=' + encodeURIComponent(params.get('api')) : '');
                            document.getElementById('rsvpPublic').hidden = true;
                            rsvpApp.hidden = false;
                            if (data.invite.vendor) { renderVendor(data.invite); return; }
                            document.querySelector('.scroll-cue').textContent = 'Kindly RSVP';
                            document.getElementById('rsvpTitle').innerHTML = 'Will you <em>join us</em>?';
                            if (data.settings.deadline) {
                                document.querySelectorAll('[data-rsvp-deadline]').forEach(function (el) { el.textContent = data.settings.deadline; });
                            }
                            if (data.invite.responded || data.settings.closed) renderSummary();
                            else renderForm();
                            updateRsvpNudge();
                            loadGames();
                            loadSongs();
                        });
                    })
                    .catch(function () {
                        if (inviteCode) coverNote.textContent = 'We couldn\u2019t load your invitation. Please check your connection and refresh.';
                    });
            }
        })();
    </script>
</body>
</html>
