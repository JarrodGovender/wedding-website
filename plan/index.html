<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#ffffff">
    <title>Planning | Jarrod & Telicia</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%230a0a0a'/%3E%3Ctext x='32' y='41' font-family='Georgia,serif' font-size='24' fill='%23ffffff' text-anchor='middle'%3EJ%26amp;T%3C/text%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..700;1,400..700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        /* The vendors' planning page: the wedding site's black and white, built for reading at a glance */
        :root { --ink: #0a0a0a; --paper: #ffffff; --stone: #f4f4f4; --muted: #5a5a5a; --line: rgba(0, 0, 0, 0.12); --serif: 'Playfair Display', Didot, Georgia, serif; --sans: 'Inter', 'Helvetica Neue', Arial, sans-serif; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { background: var(--paper); color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased; }
        [hidden] { display: none !important; }
        a { color: inherit; }
        button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
        .wrap { max-width: 960px; margin: 0 auto; padding: 0 20px; }
        .eyebrow { display: block; font-size: 0.66rem; font-weight: 500; letter-spacing: 0.26em; text-transform: uppercase; color: var(--muted); }

        header.top { padding: calc(40px + env(safe-area-inset-top, 0px)) 0 28px; border-bottom: 1px solid var(--ink); }
        header.top h1 { margin-top: 12px; font-family: var(--serif); font-weight: 400; font-size: clamp(2.6rem, 9vw, 4rem); line-height: 0.95; letter-spacing: -0.02em; }
        header.top h1 em { font-style: italic; }
        .hello { margin-top: 18px; font-family: var(--serif); font-size: 1.15rem; line-height: 1.5; }
        .note { margin-top: 14px; padding: 14px 16px; border-left: 2px solid var(--ink); background: var(--stone); font-size: 0.95rem; line-height: 1.55; }
        .links { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 22px; }
        .btn { display: inline-flex; align-items: center; gap: 8px; padding: 13px 18px; font-size: 0.7rem; font-weight: 600; letter-spacing: 0.22em; text-transform: uppercase; text-decoration: none; border: 1px solid var(--ink); }
        .btn-solid { background: var(--ink); color: var(--paper); }
        .meta { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; margin-top: 22px; font-size: 0.78rem; color: var(--muted); }
        .meta button { text-decoration: underline; text-underline-offset: 3px; }
        nav.jump { display: flex; gap: 18px; flex-wrap: wrap; margin-top: 16px; font-size: 0.7rem; letter-spacing: 0.2em; text-transform: uppercase; }
        nav.jump a { text-decoration: none; border-bottom: 1px solid var(--ink); padding-bottom: 2px; }

        section.panel { padding: 44px 0 8px; }
        .panel h2 { margin-top: 8px; font-family: var(--serif); font-weight: 400; font-size: clamp(1.8rem, 5vw, 2.4rem); }
        .panel h2 em { font-style: italic; }
        .panel .lede { margin-top: 8px; font-size: 0.92rem; line-height: 1.55; color: var(--muted); max-width: 640px; }

        table.list { width: 100%; margin-top: 20px; border-collapse: collapse; font-size: 0.92rem; }
        .list th { text-align: left; padding: 0 10px 10px 0; font-size: 0.62rem; font-weight: 600; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); border-bottom: 1px solid var(--ink); }
        .list td { padding: 12px 10px 12px 0; border-bottom: 1px solid var(--line); vertical-align: top; line-height: 1.45; }
        .list td.time { width: 76px; font-family: var(--serif); font-size: 1.05rem; white-space: nowrap; }
        .list td small { display: block; color: var(--muted); font-size: 0.8rem; }
        .tbc { color: var(--muted); font-style: italic; }
        .song b { font-weight: 600; }

        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); margin-top: 22px; border-top: 1px solid var(--ink); border-left: 1px solid var(--ink); }
        .stat { background: var(--paper); padding: 16px 14px; border-right: 1px solid var(--ink); border-bottom: 1px solid var(--ink); }
        .stat b { display: block; font-family: var(--serif); font-weight: 400; font-size: 2.2rem; line-height: 1; }
        .stat span { display: block; margin-top: 6px; font-size: 0.66rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); }
        .tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 20px; }
        .chip { padding: 8px 13px; border: 1px solid var(--ink); font-size: 0.78rem; }
        .chip.on { background: var(--ink); color: var(--paper); }
        .tools input { flex: 1; min-width: 180px; padding: 10px 12px; border: 1px solid var(--ink); font: inherit; font-size: 0.9rem; }
        .tag { display: inline-block; padding: 2px 8px; font-size: 0.68rem; letter-spacing: 0.1em; text-transform: uppercase; border: 1px solid var(--ink); }
        .tag.yes { background: var(--ink); color: var(--paper); }
        .tag.no { color: var(--muted); border-color: var(--line); text-decoration: line-through; }
        .tag.waiting { border-style: dashed; }
        .requests { list-style: none; margin-top: 18px; border-top: 1px solid var(--ink); }
        .requests li { display: flex; justify-content: space-between; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); font-size: 0.92rem; }
        .requests li small { color: var(--muted); }
        .empty { margin-top: 18px; font-size: 0.92rem; color: var(--muted); }
        /* Table plan */
        .room { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 22px; margin-top: 22px; padding: 14px 16px; border: 1px solid var(--ink); background: var(--stone); }
        .room .ctl { display: inline-flex; align-items: center; gap: 8px; }
        .room .ctl span { font-size: 0.66rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); }
        .room .ctl b { min-width: 26px; text-align: center; font-family: var(--serif); font-weight: 400; font-size: 1.5rem; }
        .room button, .tcard .adj button { width: 30px; height: 30px; border: 1px solid var(--ink); background: var(--paper); font-size: 1rem; line-height: 1; }
        .room .fit { flex-basis: 100%; font-size: 0.86rem; }
        .room .fit.short { color: #8b1d1d; font-weight: 600; }
        .room button:disabled, .tcard .adj button:disabled { opacity: 0.3; cursor: not-allowed; }
        .fit.limits { color: var(--muted); font-size: 0.8rem; }
        .tcard .adj { display: inline-flex; gap: 4px; margin-left: 8px; vertical-align: middle; }
        .tcard .adj button { width: 22px; height: 22px; font-size: 0.85rem; }
        .tablegrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; margin-top: 22px; }
        .tcard { border: 1px solid var(--ink); padding: 12px 12px 10px; }
        .tcard.full { background: var(--stone); }
        .tcard.over { border: 2px solid #8b1d1d; }
        .tcard .thead { display: flex; justify-content: space-between; align-items: baseline; padding-bottom: 8px; margin-bottom: 6px; border-bottom: 1px solid var(--line); }
        .tcard .thead b { font-family: var(--serif); font-weight: 400; font-size: 1.15rem; }
        .tcard .thead span { font-size: 0.78rem; color: var(--muted); }
        .tcard.over .thead span { color: #8b1d1d; font-weight: 600; }
        .tcard ul { list-style: none; font-size: 0.84rem; line-height: 1.55; }
        .tcard li i { font-style: normal; color: var(--muted); font-size: 0.74rem; }
        .tcard li.waiting { color: var(--muted); font-style: italic; }
        .tcard li.declined { color: var(--muted); text-decoration: line-through; }
        .tempty { font-size: 0.8rem; color: var(--muted); }
        h3.sub { margin-top: 34px; font-family: var(--serif); font-weight: 400; font-size: 1.4rem; }
        /* The board: "Not seated" on the left, tables on the right */
        .board { display: grid; grid-template-columns: 290px 1fr; gap: 16px; align-items: start; margin-top: 18px; }
        .board .tablegrid { margin-top: 0; }
        .pool { position: sticky; top: 12px; max-height: calc(100vh - 24px); overflow: auto; border: 1px solid var(--ink); padding: 12px; background: var(--paper); }
        .pool-head { display: flex; justify-content: space-between; align-items: baseline; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
        .pool-head b { font-family: var(--serif); font-weight: 400; font-size: 1.2rem; }
        .pool-head span { font-size: 0.8rem; color: var(--muted); }
        .tools.tight { margin-top: 10px; gap: 6px; }
        .tools.tight .chip { padding: 6px 9px; font-size: 0.74rem; }
        .pool input[type=search] { width: 100%; margin-top: 10px; padding: 8px 10px; border: 1px solid var(--ink); font: inherit; font-size: 0.86rem; }
        .pinv { padding: 10px 0 8px; border-bottom: 1px solid var(--line); }
        .pihead { font-size: 0.78rem; font-weight: 600; cursor: grab; user-select: none; margin-bottom: 6px; }
        .pihead small { font-weight: 400; color: var(--muted); }
        .pguests, .tguests { display: flex; flex-wrap: wrap; gap: 5px; }
        .gchip { display: inline-flex; align-items: center; gap: 3px; padding: 5px 9px; border: 1px dashed var(--ink); font-size: 0.82rem; line-height: 1.2; background: var(--paper); cursor: grab; user-select: none; }
        .gchip.yes { border-style: solid; }
        .gchip.no { color: var(--muted); text-decoration: line-through; border-color: var(--line); }
        .gchip i { font-style: normal; color: var(--muted); }
        /* Seats: a rectangular table, guests along both long sides */
        .tablegrid.seats { grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); }
        .rtable { display: grid; gap: 4px; margin: 8px 0 4px; }
        .srow { display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); gap: 4px; }
        .tboard { display: flex; align-items: center; justify-content: center; height: 28px; border: 1px solid var(--ink); background: var(--stone); font-family: var(--serif); font-size: 0.82rem; color: var(--muted); }
        .rtable.main .tboard { height: 22px; }
        .seat { display: flex; align-items: center; justify-content: center; min-width: 0; min-height: 34px; padding: 2px; border: 1px dashed var(--line); }
        .seat.taken { border: 1px solid var(--ink); }
        .seat .snum { font-size: 0.66rem; color: var(--muted); }
        .seat { min-height: 40px; }
        .seat .gchip { display: block; width: 100%; padding: 3px 2px; border: 0; font-size: 0.7rem; line-height: 1.15; text-align: center; white-space: normal; overflow-wrap: anywhere; }
        .seat .gchip:not(.yes):not(.hit) { color: var(--muted); font-style: italic; }
        .seat .sname { font-size: 0.7rem; line-height: 1.15; text-align: center; overflow-wrap: anywhere; }
        .seat .sname.waiting { color: var(--muted); font-style: italic; }
        .seat .sname.declined { color: var(--muted); text-decoration: line-through; }
        .seat.over-seat { background: var(--stone); box-shadow: inset 0 0 0 2px var(--ink); }
        .tablegrid.picking .seat { cursor: pointer; }
        .tguests.unplaced { margin-top: 8px; }
        .tguests.unplaced small, .unplaced-list { width: 100%; }
        .tguests.unplaced small { font-size: 0.6rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
        .unplaced-list { list-style: none; margin-top: 6px; font-size: 0.8rem; }
        @media (max-width: 760px) { .tablegrid.seats { grid-template-columns: 1fr; } }
        /* Moving a whole table: grab it by its name */
        .tgrip { cursor: grab; user-select: none; }
        .tgrip span { color: var(--muted); font-size: 0.9em; letter-spacing: -0.1em; }
        .tcard.moving { outline: 2px dashed var(--ink); outline-offset: 2px; }
        /* Search: matching tables and names light up in bright pink glitter (Telicia's choice) */
        :root { --glitter: radial-gradient(circle at 20% 30%, rgba(255, 255, 255, 0.95) 0 1px, transparent 1.6px), radial-gradient(circle at 70% 60%, rgba(255, 255, 255, 0.85) 0 1px, transparent 1.5px), radial-gradient(circle at 45% 85%, rgba(255, 255, 255, 0.9) 0 0.8px, transparent 1.4px), radial-gradient(circle at 85% 15%, rgba(255, 230, 245, 0.95) 0 1.2px, transparent 1.8px); }
        .tcard.found { background: var(--glitter) 0 0 / 22px 22px, linear-gradient(135deg, #ffe0f0, #ffc2e2 50%, #ffe0f0); border: 2px solid #ff1493; box-shadow: 0 0 0 3px rgba(255, 20, 147, 0.25), 0 0 18px rgba(255, 20, 147, 0.35); }
        .gchip.hit { background: radial-gradient(circle at 15% 25%, rgba(255, 255, 255, 0.9) 0 1px, transparent 1.6px), radial-gradient(circle at 80% 75%, rgba(255, 255, 255, 0.8) 0 1px, transparent 1.6px), linear-gradient(110deg, #e0007a 0%, #ff2d9b 35%, #ff6cc0 50%, #ff2d9b 65%, #e0007a 100%); background-size: 30px 18px, 30px 18px, 250% 100%; border: 1px solid #a8005c; color: #ffffff; font-weight: 700; text-decoration: none; text-shadow: 0 1px 2px rgba(90, 0, 45, 0.7); box-shadow: 0 0 10px rgba(255, 20, 147, 0.55); animation: glitz 2.4s linear infinite; }
        .gchip.hit i { color: #ffe3f3; }
        @keyframes glitz { from { background-position: 0 0, 0 0, 100% 0; } to { background-position: 30px 0, -30px 0, -150% 0; } }
        .tcard.flash { animation: tflash 1.4s ease-out; }
        @keyframes tflash { 0%, 40% { box-shadow: 0 0 0 8px rgba(255, 20, 147, 0.5), 0 0 28px rgba(255, 20, 147, 0.6); } 100% { box-shadow: 0 0 0 3px rgba(255, 20, 147, 0.25), 0 0 18px rgba(255, 20, 147, 0.35); } }
        @media (prefers-reduced-motion: reduce) { .gchip.hit, .tcard.flash { animation: none; } }
        .found-list { display: grid; gap: 4px; padding: 10px 0; border-bottom: 1px solid var(--line); }
        .found-list b { font-size: 0.66rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
        .found-list button { display: flex; justify-content: space-between; gap: 8px; padding: 7px 9px; background: var(--glitter) 0 0 / 18px 18px, linear-gradient(135deg, #ffe0f0, #ffc2e2); border: 1px solid #ff1493; font-size: 0.84rem; text-align: left; }
        .found-list button span { color: #c2006e; }
        .found-list button span { font-weight: 600; white-space: nowrap; }
        .found-list small { font-size: 0.76rem; color: var(--muted); }
        .gchip.picked { background: var(--ink); color: var(--paper); border-style: solid; }
        .tcard[data-drop] { min-height: 92px; transition: background 0.15s, box-shadow 0.15s; }
        .tguests .tempty { width: 100%; }
        .over-drop { background: var(--stone) !important; box-shadow: 0 0 0 2px var(--ink) inset; }
        .tablegrid.picking .tcard, .board:has(.tablegrid.picking) .pool { cursor: pointer; box-shadow: 0 0 0 1px var(--ink) inset; }
        body.dragging, body.dragging * { cursor: grabbing !important; }
        .ghost { position: fixed; z-index: 60; pointer-events: none; padding: 6px 10px; background: var(--ink); color: var(--paper); font-size: 0.82rem; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25); }
        .pickbar { position: fixed; left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); z-index: 25; max-width: 560px; margin: 0 auto; display: flex; gap: 12px; align-items: center; padding: 12px 14px; background: var(--paper); border: 1px solid var(--ink); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2); }
        .pickbar p { flex: 1; font-size: 0.9rem; line-height: 1.4; }
        @media (max-width: 760px) {
            /* Phones: the "Not seated" list sits on top (scrolls inside itself), tables below; tap a name, then a table */
            .board { grid-template-columns: 1fr; }
            .pool { position: sticky; top: 0; z-index: 5; max-height: 42vh; }
            .tablegrid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
            .tcard .thead { flex-wrap: wrap; gap: 4px; }
            .tcard .adj { margin-left: 4px; }
        }
        /* Send desk */
        ul.desk { list-style: none; margin-top: 18px; border-top: 1px solid var(--ink); }
        ul.desk li { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px 16px; padding: 14px 0; border-bottom: 1px solid var(--line); }
        ul.desk .who b { font-weight: 600; }
        ul.desk .who small { display: block; margin-top: 3px; color: var(--muted); font-size: 0.8rem; }
        ul.desk .who small.status { color: var(--ink); }
        ul.desk .warn { color: #8b1d1d; }
        ul.desk .acts { display: flex; flex-wrap: wrap; gap: 6px; }
        ul.desk .send, ul.desk .copy { padding: 9px 12px; font-size: 0.68rem; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; border: 1px solid var(--ink); }
        ul.desk .send { background: var(--ink); color: var(--paper); }
        ul.desk .send.again { background: var(--paper); color: var(--ink); }
        ul.desk .undo { font-size: 0.75rem; text-decoration: underline; color: var(--muted); }
        .done-toggle { display: inline-flex; align-items: center; gap: 6px; font-size: 0.82rem; color: var(--muted); }
        .tools .done-toggle input { flex: none; min-width: 0; width: 16px; height: 16px; padding: 0; border: 0; }
        .btn[disabled] { opacity: 0.35; }
        .confirm { position: fixed; left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); z-index: 20; max-width: 560px; margin: 0 auto; padding: 16px; background: var(--paper); border: 1px solid var(--ink); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2); }
        .confirm p { font-family: var(--serif); font-size: 1.05rem; line-height: 1.4; margin-bottom: 12px; }
        .confirm div { display: flex; gap: 8px; }
        footer { padding: 48px 0 calc(40px + env(safe-area-inset-bottom, 0px)); font-size: 0.75rem; color: var(--muted); }
        .center { min-height: 80vh; display: grid; place-items: center; text-align: center; padding: 24px; }
        .center p { margin-top: 12px; font-family: var(--serif); font-size: 1.15rem; }
        @media (max-width: 560px) {
            .list.guests td:nth-child(2), .list.guests th:nth-child(2) { display: none; } /* phones: the invite name moves under the guest */
        }
        /* Event tabs: the wedding plus each pre-wedding event, each in that event's own look */
        .evbar { position: sticky; top: 0; z-index: 30; background: var(--paper); border-bottom: 1px solid var(--line); padding-top: env(safe-area-inset-top, 0px); }
        .evbar .wrap { display: flex; align-items: center; gap: 12px; }
        .evbar-label { flex: none; font-size: 0.6rem; letter-spacing: 0.22em; text-transform: uppercase; color: var(--muted); }
        .evtabs { display: flex; gap: 6px; overflow-x: auto; padding: 10px 0; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
        .evtabs::-webkit-scrollbar { display: none; }
        .evtab { flex: none; display: inline-flex; align-items: center; gap: 6px; padding: 8px 12px; border: 1px solid var(--line); font-size: 0.78rem; white-space: nowrap; }
        .evtab.on { background: var(--ink); color: var(--paper); border-color: var(--ink); }
        .evtab .lock { width: 11px; height: 11px; opacity: 0.7; }
        .evbar + header.top { padding-top: 34px; }
        @media (max-width: 560px) { .evbar-label { display: none; } }
        .facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 14px 24px; margin-top: 24px; }
        .facts span { display: block; font-size: 0.6rem; letter-spacing: 0.22em; text-transform: uppercase; opacity: 0.75; }
        .facts b { display: block; margin-top: 4px; font-weight: 500; font-size: 0.98rem; line-height: 1.4; }
        .evhead .emblem { display: block; width: 46px; height: 46px; margin-bottom: 14px; }
        .evhead .meta { color: inherit; opacity: 0.85; }
        .unlock { margin-top: 24px; max-width: 540px; }
        .unlock label { display: block; font-size: 1.05rem; line-height: 1.5; }
        .unlock div { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
        .unlock input { flex: 1; min-width: 200px; padding: 13px 14px; border: 1px solid currentColor; background: var(--paper); color: var(--ink); font: inherit; font-size: 1rem; letter-spacing: 0.12em; text-transform: uppercase; }
        .unlock .err { margin-top: 12px; font-weight: 600; line-height: 1.45; }
        .unlock .hint { margin-top: 10px; font-size: 0.85rem; opacity: 0.8; line-height: 1.5; }
        ul.desk .who small.ok { color: var(--ink); }

        /* The six looks, taken from each event's own page */
        .pots { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; margin-top: 22px; }
        .pot { border: 1px solid var(--ink); padding: 16px; background: var(--paper); }
        .pot h3 { font-family: var(--serif); font-weight: 400; font-size: 1.3rem; }
        .pot .big { margin-top: 8px; font-family: var(--serif); font-size: 2.2rem; line-height: 1; }
        .pot .big span { margin-left: 8px; font-family: var(--sans); font-size: 0.66rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); }
        .pot dl, .moneylist { margin-top: 12px; font-size: 0.86rem; }
        .pot dl div, .moneylist div { display: flex; justify-content: space-between; gap: 12px; padding: 6px 0; border-bottom: 1px solid var(--line); }
        .pot dt, .moneylist dt { color: var(--muted); }
        .moneylist { max-width: 560px; border-top: 1px solid var(--ink); }
        .scrollx { overflow-x: auto; -webkit-overflow-scrolling: touch; }
        table.money { min-width: 520px; }
        .list td.num { white-space: nowrap; }
        .list td.owes { font-weight: 600; }
        .small-note { margin-top: 8px; font-size: 0.8rem; color: var(--muted); }
        .lede a { color: var(--ink); }
        ul.desk a.send { text-decoration: none; }
        .linkish { text-decoration: underline; text-underline-offset: 3px; font-weight: 600; }
        #evInvHelp:empty { display: none; }

<body>
<main id="app">
    <div class="center" id="loading"><div><span class="eyebrow">Jarrod &amp; Telicia · 25 · 04 · 2027</span><p>Opening your planning page…</p></div></div>
</main>

<script>
(function () {
    'use strict';
    // The same Google script as the wedding RSVP. Only a vendor's code opens this page, and it only
    // sends the panels ticked for that vendor. A local test can point it elsewhere with ?api= (localhost only).
    var RSVP_ENDPOINT = 'https://script.google.com/macros/s/AKfycbyinQ-3JaQqG4m9UJAm3d2eN2lzKSMWaDeW3NUkEY9FM4oy3LbTDbwJpCfqszZfyY4whw/exec';
    var params = new URLSearchParams(location.search);
    var isLocal = /^(localhost|127\.0\.0\.1)$/.test(location.hostname);
    var api = (isLocal && params.get('api')) || RSVP_ENDPOINT;
    var code = (params.get('vendor') || '').trim().toUpperCase();
    // Jarrod and Telicia's own link (?admin=KEY): every panel plus the send desk
    var adminKey = (params.get('admin') || '').trim().toUpperCase();
    var sideFilter = 'all';          // Everyone / Jarrod's / Telicia's, for the send desk and the guest list
    var deskStage = 'thanks';        // which message is being sent (the invites are out, so thank-yous first)
    var deskShowDone = false;
    var pending = null;              // a WhatsApp just opened, waiting for "yes, sent"
    var TZ = 'Africa/Johannesburg';
    var app = document.getElementById('app');
    var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
    var data = null;
    var guestFilter = 'all', guestSearch = '';

    function fail(msg) {
        app.innerHTML = '<div class="center"><div><span class="eyebrow">Jarrod &amp; Telicia · 25 · 04 · 2027</span><p>' + msg + '</p></div></div>';
    }

    function load(quiet) {
        if (!code && !adminKey) return fail('This page needs your personal planning link. Please check it with Jarrod or Telicia.');
        return fetch(api + '?action=plan&' + (adminKey ? 'admin=' + encodeURIComponent(adminKey) : 'vendor=' + encodeURIComponent(code)))
            .then(function (r) { return r.json(); })
            .then(function (d) {
                if (!d.ok) return fail('This planning link doesn’t work. Please check it with Jarrod or Telicia.');
                data = d;
                if (current === 'wedding') render();
            })
            .catch(function () { if (!quiet && current === 'wedding') fail('Couldn’t load your planning page. Check your signal and refresh.'); });
    }

    function time(t) { return t ? esc(t) : '<span class="tbc">TBC</span>'; }

    function render() {
        var v = data.vendor;
        var first = v.name.split(' ')[0];
        var sections = [];
        var jump = [];
        var html = '<header class="top"><div class="wrap">' +
            '<span class="eyebrow">Jarrod &amp; Telicia · 25 · 04 · 2027</span>' +
            '<h1>The <em>planning</em> room</h1>' +
            (data.couple
                ? '<p class="hello">Your planning room: send invites and reminders, and see everything your vendors see, live from your sheet.</p><p class="note">Keep this link to yourselves. It shows guests’ phone numbers.</p>'
                : '<p class="hello">Hi ' + esc(first) + (v.role ? ', our ' + esc(v.role.toLowerCase()) : '') + '. Everything you need for the day, live from our own planning sheet.</p>' +
                    (v.note ? '<p class="note">' + esc(v.note) + '</p>' : '') +
                    '<div class="links"><a class="btn btn-solid" href="../?invite=' + encodeURIComponent(v.code) + (isLocal && params.get('api') ? '&api=' + encodeURIComponent(params.get('api')) : '') + '">Wedding website →</a>' +
                    (v.access.indexOf('camera') !== -1 ? '<a class="btn" href="../camera/?invite=' + encodeURIComponent(v.code) + (isLocal && params.get('api') ? '&api=' + encodeURIComponent(params.get('api')) : '') + '">The Darkroom →</a>' : '') + '</div>');

        if (data.desk) {
            jump.push(['desk', 'Send desk']);
            sections.push('<section class="panel" id="desk"><div class="wrap"><span class="eyebrow">Invitations &amp; reminders</span><h2>The send <em>desk</em></h2>' +
                '<p class="lede">Tap a button and WhatsApp opens with the message written and their personal link in it. Press Send in WhatsApp, come back here and confirm, and it’s ticked off.</p>' +
                '<div class="tools" id="deskSides"></div><div class="tools" id="deskStages"></div>' +
                '<div class="stats" id="deskStats"></div>' +
                '<div class="tools"><button class="btn btn-solid" id="deskNext">Send the next one →</button><label class="done-toggle"><input type="checkbox" id="deskDone"' + (deskShowDone ? ' checked' : '') + '> Show ones already done</label></div>' +
                '<ul class="desk" id="deskList"></ul><p class="empty" id="deskEmpty" hidden></p></div></section>');
        }

        if (data.day) {
            jump.push(['day', 'The day']);
            sections.push('<section class="panel" id="day"><div class="wrap"><span class="eyebrow">Running order</span><h2>The <em>day</em></h2>' +
                (data.day.length ? '<table class="list"><thead><tr><th>Time</th><th>Moment</th></tr></thead><tbody>' + data.day.map(function (r) {
                    return '<tr><td class="time">' + time(r.time) + '</td><td>' + esc(r.moment) + (r.notes ? '<small>' + esc(r.notes) + '</small>' : '') + '</td></tr>';
                }).join('') + '</tbody></table>' : '<p class="empty">The running order is still being finalised.</p>') + '</div></section>');
        }
        if (data.music) {
            jump.push(['music', 'Music cues']);
            var chosen = data.music.filter(function (r) { return r.song; }).length;
            sections.push('<section class="panel" id="music"><div class="wrap"><span class="eyebrow">For the DJ · ' + chosen + ' of ' + data.music.length + ' chosen</span><h2>Music <em>cues</em></h2>' +
                '<p class="lede">One song for each moment of the day. Anything still marked “to be chosen” is ours to decide; we’ll fill it in here.</p>' +
                '<table class="list"><thead><tr><th>Time</th><th>Moment</th><th>Song</th></tr></thead><tbody>' + data.music.map(function (r) {
                    return '<tr><td class="time">' + time(r.time) + '</td><td>' + esc(r.moment) + (r.notes ? '<small>' + esc(r.notes) + '</small>' : '') + '</td><td class="song">' +
                        (r.song ? '<b>' + esc(r.song) + '</b>' + (r.artist ? '<small>' + esc(r.artist) + '</small>' : '') : '<span class="tbc">To be chosen</span>') + '</td></tr>';
                }).join('') + '</tbody></table></div></section>');
        }
        if (data.songs) {
            jump.push(['songs', 'Song requests']);
            var s = data.songs;
            sections.push('<section class="panel" id="songs"><div class="wrap"><span class="eyebrow">From our guests · ' + s.requests.length + ' songs</span><h2>Song <em>requests</em></h2>' +
                '<p class="lede">Songs guests added from the wedding website, live. They’re all on our Spotify playlist too.</p>' +
                (s.playlist ? '<div class="links"><a class="btn" href="' + esc(s.playlist) + '" target="_blank" rel="noopener">Open the playlist on Spotify ↗</a></div>' : '') +
                (s.requests.length ? '<ul class="requests">' + s.requests.map(function (r) {
                    var title = '<b>' + esc(r.song) + '</b> <small>· ' + esc(r.artist) + '</small>';
                    return '<li><span>' + (r.link ? '<a href="' + esc(r.link) + '" target="_blank" rel="noopener">' + title + '</a>' : title) + '</span><small>' + esc(r.by) + '</small></li>';
                }).join('') + '</ul>' : '<p class="empty">No song requests yet.</p>') +
                (s.typed.length ? '<span class="eyebrow" style="margin-top:28px">Also asked for on RSVPs</span><ul class="requests">' + s.typed.map(function (t) {
                    return '<li><span>' + esc(t.text) + '</span><small>' + esc(t.invite) + '</small></li>';
                }).join('') + '</ul>' : '') + '</div></section>');
        }
        if (data.tables) {
            jump.push(['tables', 'Table plan']);
            sections.push('<section class="panel" id="tables"><div class="wrap"><span class="eyebrow" id="tablesEyebrow">Who sits where</span><h2>Table <em>plan</em></h2>' +
                (data.couple ? '<p class="lede">Drag a name onto a seat (or tap a name, then a seat). Drop it anywhere else on a table to seat them there without a set place, or on a taken seat to swap. Drag an invitation’s name to seat the whole household. Everything saves straight away, and your planner sees it live.</p>' : '<p class="lede">Who sits where, live from our plan. Guests in grey haven’t replied yet.</p>') +
                (data.couple ? '<div class="room" id="roomBar"></div>' +
                    '<div class="board" id="board"><aside class="pool" data-drop=""><div class="pool-head"><b>Not seated</b><span id="poolCount"></span></div>' +
                    '<div class="tools tight" id="poolSides"></div><div class="tools tight">' + [['open', 'Everyone'], ['yes', 'Attending'], ['waiting', 'Waiting']].map(function (c) {
                        return '<button class="chip" data-pool="' + c[0] + '">' + c[1] + '</button>';
                    }).join('') + '</div><input type="search" id="poolSearch" placeholder="Find a guest" value="' + esc(poolSearch) + '"><div id="poolList"></div></aside>' +
                    '<div class="tablegrid" id="tableGrid"></div></div>' +
                    '<div class="pickbar" id="pickBar" hidden><p></p><button class="btn" id="pickCancel">Cancel</button></div>'
                    : '<div class="tablegrid" id="tableGrid"></div>') +
                '</div></section>');
        }
        if (data.guests) {
            jump.push(['guests', 'Guest list']);
            var g = data.guests;
            sections.push('<section class="panel" id="guests"><div class="wrap"><span class="eyebrow">Live from the RSVPs</span><h2>Guest <em>list</em></h2>' +
                '<div class="stats">' +
                [['Attending', g.yes], ['Still to reply', g.waiting], ['Declined', g.no], ['Invited', g.total], ['Dietary needs', g.dietary]].map(function (x) {
                    return '<div class="stat"><b>' + x[1] + '</b><span>' + x[0] + '</span></div>';
                }).join('') + '</div>' +
                (data.couple ? '<div class="tools" id="guestSides"></div>' : '') + '<div class="tools" id="guestTools">' + [['all', 'Everyone'], ['Yes', 'Attending'], ['Waiting', 'Still to reply'], ['No', 'Declined'], ['diet', 'Dietary needs']].map(function (c) {
                    return '<button class="chip" data-filter="' + c[0] + '">' + c[1] + '</button>';
                }).join('') + '<input type="search" id="guestSearch" placeholder="Find a guest" value="' + esc(guestSearch) + '"><button class="chip" id="guestCsv">Download CSV</button></div>' +
                '<table class="list guests"><thead><tr><th>Guest</th><th>Invite</th><th>Reply</th><th>Table</th><th>Dietary</th></tr></thead><tbody id="guestRows"></tbody></table>' +
                '<p class="empty" id="guestEmpty" hidden>No guests match.</p></div></section>');
        }
        var updated = new Date(data.updated).toLocaleTimeString('en-ZA', { timeZone: TZ, hour: '2-digit', minute: '2-digit', hour12: false });
        html += '<div class="meta"><span>Updated ' + esc(updated) + ' · refreshes itself every minute</span><button id="refresh">Refresh now</button></div>' +
            (jump.length > 1 ? '<nav class="jump">' + jump.map(function (j) { return '<a href="#' + j[0] + '">' + j[1] + '</a>'; }).join('') + '</nav>' : '') +
            '</div></header>' + sections.join('') +
            '<footer><div class="wrap">This page is for ' + esc(v.name) + ' only. Please don’t share the link: it shows live details about our guests.</div></footer>';
        var y = window.scrollY;
        app.innerHTML = evBar() + html;
        wireBar();
        window.scrollTo(0, y);
        document.getElementById('refresh').addEventListener('click', function () { load(); });
        if (data.guests) wireGuests();
        if (data.desk) wireDesk();
        if (data.tables) wireTables();
    }

    function guestMatches(x) {
        if (data.couple && sideFilter !== 'all' && x.side !== sideFilter) return false;
        if (guestFilter === 'diet' && !x.dietary) return false;
        if (guestFilter !== 'all' && guestFilter !== 'diet' && x.attending !== guestFilter) return false;
        var q = guestSearch.trim().toLowerCase();
        return !q || (x.guest + ' ' + x.invite + ' ' + x.dietary).toLowerCase().indexOf(q) !== -1;
    }
    // ---------- The send desk (couple only) ----------
    var STAGES = [['invite', 'Invites'], ['thanks', 'Thank-yous'], ['reminder', 'January reminder'], ['followup', 'March follow-up'], ['all', 'Everything']];
    var STAGE_WORD = { invite: 'invite', reminder: 'reminder', followup: 'follow-up', thanks: 'thank-you' };
    var shortDate = function (iso) { return iso ? new Date(iso).toLocaleDateString('en-ZA', { timeZone: TZ, day: 'numeric', month: 'short' }) : ''; };
    var sideOf = function (i) { return sideFilter === 'all' || i.side === sideFilter; };
    /** Does this invitation still need this stage's message? */
    function needs(i, stage) {
        if (stage === 'invite') return !i.sent.invite && !i.replied; // replied = they already have the link
        if (stage === 'reminder') return !!i.sent.invite && !i.replied && !i.sent.reminder;
        if (stage === 'followup') return !!i.sent.invite && !i.replied && !i.sent.followup;
        if (stage === 'thanks') return i.replied && !i.sent.thanks; // one thank-you per reply: "coming" or "not coming", picked from their answer
        return true;
    }

    // ---------- The table plan ----------

    // ---------- Seats: rectangular tables, guests along the two long sides, nobody at the ends ----------

    // ---------- The room: number of tables, usual seats, and any bigger or smaller table ----------

    // The venue's limits come from the sheet (Max Tables, Max Seats Per Table); 16 and 9 if it says nothing

    /** Changes the room on the page straight away, then saves it; puts it back if the save is refused */

    // ---------- The board: a "Not seated" column, tables as drop zones ----------

                '<small>' + esc(s.spentBy) + ' · ' + esc(s.date) + (s.by && s.by !== s.spentBy ? ' · added by ' + esc(s.by) : '') + '</small></div>' +
                '<div class="acts">' + state + (c.ready ? ' <button class="undo" data-cost-act="remove" data-tab="spend" data-id="' + esc(s.id) + '" aria-label="Remove">remove</button>' : '') + '</div></li>';
        }).join('') + '</ul>' : '<p class="empty">Nothing spent yet.</p>';

        // Payments in (the whole weekend: shares aren't split by night)
        var pays = c.payments || [];
        html += '<h3 class="sub">Payments in · whole weekend</h3>';
        html += pays.length ? '<ul class="ledger">' + pays.map(function (p) {
            return '<li><div><b>' + rands(p.amount) + '</b> from ' + esc(p.name) + ' · ' + esc(p.kind === 'Other costs' ? 'Friday costs' : p.kind) + ' · to ' + esc(first(p.to)) +
                '<small>' + esc(p.date) + (p.note ? ' · ' + esc(p.note) : '') + (p.by ? ' · recorded by ' + esc(p.by) : '') + '</small></div>' +
                (c.ready ? '<div class="acts"><button class="undo" data-cost-act="remove" data-tab="payments" data-id="' + esc(p.id) + '">remove</button></div>' : '') + '</li>';
        }).join('') + '</ul>' : '<p class="empty">No payments recorded yet.</p>';

        // Guests chipping in on this night
        if (c.guests.length) {
            html += '<h3 class="sub">Guest contributions · ' + esc(c.night) + '</h3><ul class="ledger">' + c.guests.map(function (x) {
                var paid = /[1-9]/.test(x.paid);
                return '<li><div><b>' + esc(x.name) + '</b>' + (x.promised ? ' · promised ' + esc(x.promised) : '') + '<small>' + (paid ? 'Paid ' + esc(x.paid) + (x.date ? ' on ' + esc(x.date) : '') : 'Not paid yet') + (x.notes ? ' · ' + esc(x.notes) : '') + '</small></div>' +
                    (c.ready ? '<div class="acts">' + (paid ? '<span class="pill ok">Paid</span> <button class="undo" data-cost-act="guest-undo" data-name="' + esc(x.name) + '">undo</button>' : '<button class="chip" data-cost-act="guest" data-name="' + esc(x.name) + '">Mark paid</button>') + '</div>' : '') + '</li>';
            }).join('') + '</ul>';
        }

        // The sheet's own breakdown
        var table = function (cols, rows) {
            return '<div class="scrollx"><table class="list money"><thead><tr>' + cols.map(function (h) { return '<th>' + esc(h) + '</th>'; }).join('') + '</tr></thead><tbody>' +
                rows.map(function (r) { return '<tr>' + r.join('') + '</tr>'; }).join('') + '</tbody></table></div>';
        };
        var td = function (v, cls) { return '<td' + (cls ? ' class="' + cls + '"' : '') + '>' + esc(v || '') + '</td>'; };
        html += '<details class="breakdown"><summary>The full breakdown from the sheet</summary>';
        if (c.pots.length) {
            html += '<div class="pots">' + c.pots.map(function (p) {
                var share = p.lines.filter(function (l) { return /share/i.test(l[0]); })[0];
                return '<div class="pot"><h3>' + esc(p.name) + '</h3>' + (share ? '<p class="big">' + esc(share[1]) + '<span>each</span></p>' : '') +
                    '<dl>' + p.lines.filter(function (l) { return l !== share; }).map(function (l) { return '<div><dt>' + esc(noR(l[0])) + '</dt><dd>' + esc(l[1]) + '</dd></div>'; }).join('') + '</dl></div>';
            }).join('') + '</div>';
        }
        if (c.budget.length) {
            html += '<h3 class="sub">Budget</h3>' + table(['Category', 'Who', 'Budget', 'Spent', 'Left', 'Plans'], c.budget.map(function (b) {
                return [td(b.category), td(b.who), td(b.budget, 'num'), td(b.spent, 'num'), td(b.left, 'num'), td(b.plans)];
            }));
        }
        if (c.people.length) {
            var shareCols = c.people[0].shares.map(function (s) { return s[0]; });
            var split = c.people.some(function (p) { return p.paidAirbnb !== '' || p.paidOther !== ''; });
            html += '<h3 class="sub">Who pays what</h3>' + table(['Name', 'Side'].concat(shareCols, ['Due, whole weekend'], split ? ['Paid for Airbnb', 'Paid for other'] : [], ['Paid', 'Still owes']), c.people.map(function (p) {
                return [td(p.name), td(p.side)].concat(p.shares.map(function (s) { return td(s[1], 'num'); }), [td(p.due, 'num')],
                    split ? [td(p.paidAirbnb, 'num'), td(p.paidOther, 'num')] : [], [td(p.paid, 'num'), td(p.owes, 'num' + (owesMoney(p.owes) ? ' owes' : ''))]);
            })) + '<p class="small-note">Payments aren’t split by night, so Paid and Still owes cover the whole weekend.</p>';
        }
        if (c.money.length) {
            html += '<h3 class="sub">The whole weekend</h3><dl class="moneylist">' + c.money.map(function (m) { return '<div><dt>' + esc(noR(m[0])) + '</dt><dd>' + esc(m[1]) + '</dd></div>'; }).join('') + '</dl>';
        }
        return html + '</details></div></section>';
    }
    var COST_ERR = {
        who: 'Pick your name under “Recording as” first.',
        bad_name: 'Pick who paid from the list.',
        bad_request: 'Check the amount and the other boxes, then try again.',
        not_found: 'That entry has changed on the sheet. The page has been refreshed.',
        not_set_up: 'Recording switches on once Jarrod upgrades the costs sheet.',
        busy: 'Lots happening at once. Try again in a moment.'
    };
    function costPost(body, button) {
        var slug = current;
        var who = whoAmI();
        if (!who) { alert(COST_ERR.who); var sel = document.getElementById('costWho'); if (sel) sel.focus(); return; }
        if (button) { button.disabled = true; button.dataset.label = button.textContent; button.textContent = 'Saving…'; }
        var open = [].map.call(document.querySelectorAll('#evMoney details[open]'), function (d) { return d.className; });
        return fetch(api, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({ event: slug, pass: savedPass(slug), by: who }, body)) })
            .then(function (r) { return r.json(); })
            .then(function (res) {
                if (!res.ok) throw res;
                if (evData[slug]) evData[slug].costs = res.costs;
                if (current === slug) {
                    renderEvent();
                    open.filter(function (c) { return c.indexOf('breakdown') !== -1; }).forEach(function () { var d = document.querySelector('#evMoney details.breakdown'); if (d) d.open = true; });
                }
            })
            .catch(function (err) {
                if (button) { button.disabled = false; button.textContent = button.dataset.label; }
                if (err && LOCK_MSG[err.error]) { keepPass(slug, ''); delete evData[slug]; if (current === slug) renderLock(LOCK_MSG[err.error]); return; }
                alert((err && COST_ERR[err.error]) || 'Couldn’t save that. Check your signal and try again.');
                if (err && err.error === 'not_found') loadEvent(slug, true);
            });
    }
    function wireMoney() {
        var who = document.getElementById('costWho');
        if (who) who.addEventListener('change', function () { setWho(who.value); });
        document.querySelectorAll('#evMoney form[data-cost]').forEach(function (f) {
            f.addEventListener('submit', function (e) {
                e.preventDefault();
                var body = { action: 'costAdd', kind: f.getAttribute('data-cost') };
                [].forEach.call(f.elements, function (el) { if (el.name) body[el.name] = el.value.trim(); });
                costPost(body, f.querySelector('button[type="submit"]'));
            });
        });
        document.querySelectorAll('#evMoney [data-cost-act]').forEach(function (b) {
            b.addEventListener('click', function () {
                var act = b.getAttribute('data-cost-act'), id = b.getAttribute('data-id'), name = b.getAttribute('data-name');
                if (act === 'remove') { if (confirm('Remove this entry? It stays on the sheet, marked as removed.')) costPost({ action: 'costUpdate', kind: 'remove', tab: b.getAttribute('data-tab'), id: id }, b); }
                else if (act === 'payback') costPost({ action: 'costUpdate', kind: 'payback', id: id }, b);
                else if (act === 'payback-undo') costPost({ action: 'costUpdate', kind: 'payback', id: id, undo: true }, b);
                else if (act === 'guest') {
                    var amt = prompt('How much did ' + name + ' pay? (R)', '200');
                    if (amt) costPost({ action: 'costUpdate', kind: 'guestPaid', name: name, amount: amt }, b);
                }
                else if (act === 'guest-undo') costPost({ action: 'costUpdate', kind: 'guestPaid', name: name, undo: true }, b);
            });
        });
    }

    show();
    // Live: quietly refresh every minute while the page is open
    setInterval(function () {
        if (document.hidden) return;
        if (current !== 'wedding') {
            var busy = document.activeElement && (document.activeElement.id === 'evSearch' || document.activeElement.id === 'evPass');
            busy = busy || !!document.querySelector('#evMoney details.costform[open]');
            if (current && savedPass(current) && evData[current] && !busy && !evPending) loadEvent(current, true);
            return;
        }
        var typing = document.activeElement && document.activeElement.id === 'guestSearch';
        typing = typing || (document.activeElement && document.activeElement.id === 'poolSearch') || !!picked || !!drag;
        if (!document.hidden && !typing && !pending && !seatSaving) load(true);
    }, 60000);
})();
</script>
</body>
</html>
