<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#ffffff">
    <title>Planning | Jarrod & Telicia</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%230a0a0a'/%3E%3Ctext x='32' y='41' font-family='Georgia,serif' font-size='24' fill='%23ffffff' text-anchor='middle'%3EJ%26amp;T%3C/text%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..700;1,400..700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        /* The vendors' planning page: the wedding site's black and white, built for reading at a glance */
        :root { --ink: #0a0a0a; --paper: #ffffff; --stone: #f4f4f4; --muted: #5a5a5a; --line: rgba(0, 0, 0, 0.12); --serif: 'Playfair Display', Didot, Georgia, serif; --sans: 'Inter', 'Helvetica Neue', Arial, sans-serif; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { background: var(--paper); color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased; }
        [hidden] { display: none !important; }
        a { color: inherit; }
        button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
        .wrap { max-width: 960px; margin: 0 auto; padding: 0 20px; }
        .eyebrow { display: block; font-size: 0.66rem; font-weight: 500; letter-spacing: 0.26em; text-transform: uppercase; color: var(--muted); }

        header.top { padding: calc(40px + env(safe-area-inset-top, 0px)) 0 28px; border-bottom: 1px solid var(--ink); }
        header.top h1 { margin-top: 12px; font-family: var(--serif); font-weight: 400; font-size: clamp(2.6rem, 9vw, 4rem); line-height: 0.95; letter-spacing: -0.02em; }
        header.top h1 em { font-style: italic; }
        .hello { margin-top: 18px; font-family: var(--serif); font-size: 1.15rem; line-height: 1.5; }
        .note { margin-top: 14px; padding: 14px 16px; border-left: 2px solid var(--ink); background: var(--stone); font-size: 0.95rem; line-height: 1.55; }
        .links { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 22px; }
        .btn { display: inline-flex; align-items: center; gap: 8px; padding: 13px 18px; font-size: 0.7rem; font-weight: 600; letter-spacing: 0.22em; text-transform: uppercase; text-decoration: none; border: 1px solid var(--ink); }
        .btn-solid { background: var(--ink); color: var(--paper); }
        .meta { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; margin-top: 22px; font-size: 0.78rem; color: var(--muted); }
        .meta button { text-decoration: underline; text-underline-offset: 3px; }
        nav.jump { display: flex; gap: 18px; flex-wrap: wrap; margin-top: 16px; font-size: 0.7rem; letter-spacing: 0.2em; text-transform: uppercase; }
        nav.jump a { text-decoration: none; border-bottom: 1px solid var(--ink); padding-bottom: 2px; }

        section.panel { padding: 44px 0 8px; }
        .panel h2 { margin-top: 8px; font-family: var(--serif); font-weight: 400; font-size: clamp(1.8rem, 5vw, 2.4rem); }
        .panel h2 em { font-style: italic; }
        .panel .lede { margin-top: 8px; font-size: 0.92rem; line-height: 1.55; color: var(--muted); max-width: 640px; }

        table.list { width: 100%; margin-top: 20px; border-collapse: collapse; font-size: 0.92rem; }
        .list th { text-align: left; padding: 0 10px 10px 0; font-size: 0.62rem; font-weight: 600; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); border-bottom: 1px solid var(--ink); }
        .list td { padding: 12px 10px 12px 0; border-bottom: 1px solid var(--line); vertical-align: top; line-height: 1.45; }
        .list td.time { width: 76px; font-family: var(--serif); font-size: 1.05rem; white-space: nowrap; }
        .list td small { display: block; color: var(--muted); font-size: 0.8rem; }
        .tbc { color: var(--muted); font-style: italic; }
        .song b { font-weight: 600; }

        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); margin-top: 22px; border-top: 1px solid var(--ink); border-left: 1px solid var(--ink); }
        .stat { background: var(--paper); padding: 16px 14px; border-right: 1px solid var(--ink); border-bottom: 1px solid var(--ink); }
        .stat b { display: block; font-family: var(--serif); font-weight: 400; font-size: 2.2rem; line-height: 1; }
        .stat span { display: block; margin-top: 6px; font-size: 0.66rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); }
        .tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 20px; }
        .chip { padding: 8px 13px; border: 1px solid var(--ink); font-size: 0.78rem; }
        .chip.on { background: var(--ink); color: var(--paper); }
        .tools input { flex: 1; min-width: 180px; padding: 10px 12px; border: 1px solid var(--ink); font: inherit; font-size: 0.9rem; }
        .tag { display: inline-block; padding: 2px 8px; font-size: 0.68rem; letter-spacing: 0.1em; text-transform: uppercase; border: 1px solid var(--ink); }
        .tag.yes { background: var(--ink); color: var(--paper); }
        .tag.no { color: var(--muted); border-color: var(--line); text-decoration: line-through; }
        .tag.waiting { border-style: dashed; }
        .requests { list-style: none; margin-top: 18px; border-top: 1px solid var(--ink); }
        .requests li { display: flex; justify-content: space-between; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); font-size: 0.92rem; }
        .requests li small { color: var(--muted); }
        .empty { margin-top: 18px; font-size: 0.92rem; color: var(--muted); }
        /* Table plan */
        .room { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 22px; margin-top: 22px; padding: 14px 16px; border: 1px solid var(--ink); background: var(--stone); }
        .room .ctl { display: inline-flex; align-items: center; gap: 8px; }
        .room .ctl span { font-size: 0.66rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); }
        .room .ctl b { min-width: 26px; text-align: center; font-family: var(--serif); font-weight: 400; font-size: 1.5rem; }
        .room button, .tcard .adj button { width: 30px; height: 30px; border: 1px solid var(--ink); background: var(--paper); font-size: 1rem; line-height: 1; }
        .room .fit { flex-basis: 100%; font-size: 0.86rem; }
        .room .fit.short { color: #8b1d1d; font-weight: 600; }
        .room button:disabled, .tcard .adj button:disabled { opacity: 0.3; cursor: not-allowed; }
        .fit.limits { color: var(--muted); font-size: 0.8rem; }
        .tcard .adj { display: inline-flex; gap: 4px; margin-left: 8px; vertical-align: middle; }
        .tcard .adj button { width: 22px; height: 22px; font-size: 0.85rem; }
        .tablegrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; margin-top: 22px; }
        .tcard { border: 1px solid var(--ink); padding: 12px 12px 10px; }
        .tcard.full { background: var(--stone); }
        .tcard.over { border: 2px solid #8b1d1d; }
        .tcard .thead { display: flex; justify-content: space-between; align-items: baseline; padding-bottom: 8px; margin-bottom: 6px; border-bottom: 1px solid var(--line); }
        .tcard .thead b { font-family: var(--serif); font-weight: 400; font-size: 1.15rem; }
        .tcard .thead span { font-size: 0.78rem; color: var(--muted); }
        .tcard.over .thead span { color: #8b1d1d; font-weight: 600; }
        .tcard ul { list-style: none; font-size: 0.84rem; line-height: 1.55; }
        .tcard li i { font-style: normal; color: var(--muted); font-size: 0.74rem; }
        .tcard li.waiting { color: var(--muted); font-style: italic; }
        .tcard li.declined { color: var(--muted); text-decoration: line-through; }
        .tempty { font-size: 0.8rem; color: var(--muted); }
        h3.sub { margin-top: 34px; font-family: var(--serif); font-weight: 400; font-size: 1.4rem; }
        /* The board: "Not seated" on the left, tables on the right */
        .board { display: grid; grid-template-columns: 290px 1fr; gap: 16px; align-items: start; margin-top: 18px; }
        .board .tablegrid { margin-top: 0; }
        .pool { position: sticky; top: 12px; max-height: calc(100vh - 24px); overflow: auto; border: 1px solid var(--ink); padding: 12px; background: var(--paper); }
        .pool-head { display: flex; justify-content: space-between; align-items: baseline; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
        .pool-head b { font-family: var(--serif); font-weight: 400; font-size: 1.2rem; }
        .pool-head span { font-size: 0.8rem; color: var(--muted); }
        .tools.tight { margin-top: 10px; gap: 6px; }
        .tools.tight .chip { padding: 6px 9px; font-size: 0.74rem; }
        .pool input[type=search] { width: 100%; margin-top: 10px; padding: 8px 10px; border: 1px solid var(--ink); font: inherit; font-size: 0.86rem; }
        .pinv { padding: 10px 0 8px; border-bottom: 1px solid var(--line); }
        .pihead { font-size: 0.78rem; font-weight: 600; cursor: grab; user-select: none; margin-bottom: 6px; }
        .pihead small { font-weight: 400; color: var(--muted); }
        .pguests, .tguests { display: flex; flex-wrap: wrap; gap: 5px; }
        .gchip { display: inline-flex; align-items: center; gap: 3px; padding: 5px 9px; border: 1px dashed var(--ink); font-size: 0.82rem; line-height: 1.2; background: var(--paper); cursor: grab; user-select: none; }
        .gchip.yes { border-style: solid; }
        .gchip.no { color: var(--muted); text-decoration: line-through; border-color: var(--line); }
        .gchip i { font-style: normal; color: var(--muted); }
        .gchip.picked { background: var(--ink); color: var(--paper); border-style: solid; }
        .tcard[data-drop] { min-height: 92px; transition: background 0.15s, box-shadow 0.15s; }
        .tguests .tempty { width: 100%; }
        .over-drop { background: var(--stone) !important; box-shadow: 0 0 0 2px var(--ink) inset; }
        .tablegrid.picking .tcard, .board:has(.tablegrid.picking) .pool { cursor: pointer; box-shadow: 0 0 0 1px var(--ink) inset; }
        body.dragging, body.dragging * { cursor: grabbing !important; }
        .ghost { position: fixed; z-index: 60; pointer-events: none; padding: 6px 10px; background: var(--ink); color: var(--paper); font-size: 0.82rem; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25); }
        .pickbar { position: fixed; left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); z-index: 25; max-width: 560px; margin: 0 auto; display: flex; gap: 12px; align-items: center; padding: 12px 14px; background: var(--paper); border: 1px solid var(--ink); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2); }
        .pickbar p { flex: 1; font-size: 0.9rem; line-height: 1.4; }
        @media (max-width: 760px) {
            /* Phones: the "Not seated" list sits on top (scrolls inside itself), tables below; tap a name, then a table */
            .board { grid-template-columns: 1fr; }
            .pool { position: sticky; top: 0; z-index: 5; max-height: 42vh; }
            .tablegrid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
            .tcard .thead { flex-wrap: wrap; gap: 4px; }
            .tcard .adj { margin-left: 4px; }
        }
        /* Send desk */
        ul.desk { list-style: none; margin-top: 18px; border-top: 1px solid var(--ink); }
        ul.desk li { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px 16px; padding: 14px 0; border-bottom: 1px solid var(--line); }
        ul.desk .who b { font-weight: 600; }
        ul.desk .who small { display: block; margin-top: 3px; color: var(--muted); font-size: 0.8rem; }
        ul.desk .who small.status { color: var(--ink); }
        ul.desk .warn { color: #8b1d1d; }
        ul.desk .acts { display: flex; flex-wrap: wrap; gap: 6px; }
        ul.desk .send, ul.desk .copy { padding: 9px 12px; font-size: 0.68rem; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; border: 1px solid var(--ink); }
        ul.desk .send { background: var(--ink); color: var(--paper); }
        ul.desk .send.again { background: var(--paper); color: var(--ink); }
        ul.desk .undo { font-size: 0.75rem; text-decoration: underline; color: var(--muted); }
        .done-toggle { display: inline-flex; align-items: center; gap: 6px; font-size: 0.82rem; color: var(--muted); }
        .tools .done-toggle input { flex: none; min-width: 0; width: 16px; height: 16px; padding: 0; border: 0; }
        .btn[disabled] { opacity: 0.35; }
        .confirm { position: fixed; left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); z-index: 20; max-width: 560px; margin: 0 auto; padding: 16px; background: var(--paper); border: 1px solid var(--ink); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2); }
        .confirm p { font-family: var(--serif); font-size: 1.05rem; line-height: 1.4; margin-bottom: 12px; }
        .confirm div { display: flex; gap: 8px; }
        footer { padding: 48px 0 calc(40px + env(safe-area-inset-bottom, 0px)); font-size: 0.75rem; color: var(--muted); }
        .center { min-height: 80vh; display: grid; place-items: center; text-align: center; padding: 24px; }
        .center p { margin-top: 12px; font-family: var(--serif); font-size: 1.15rem; }
        @media (max-width: 560px) {
            .list.guests td:nth-child(2), .list.guests th:nth-child(2) { display: none; } /* phones: the invite name moves under the guest */
        }
        @media print { nav.jump, .links, .tools, .meta button { display: none !important; } section.panel { break-inside: avoid-page; } }
    </style>
</head>
<body>
<main id="app">
    <div class="center" id="loading"><div><span class="eyebrow">Jarrod &amp; Telicia · 25 · 04 · 2027</span><p>Opening your planning page…</p></div></div>
</main>

<script>
(function () {
    'use strict';
    // The same Google script as the wedding RSVP. Only a vendor's code opens this page, and it only
    // sends the panels ticked for that vendor. A local test can point it elsewhere with ?api= (localhost only).
    var RSVP_ENDPOINT = 'https://script.google.com/macros/s/AKfycbyinQ-3JaQqG4m9UJAm3d2eN2lzKSMWaDeW3NUkEY9FM4oy3LbTDbwJpCfqszZfyY4whw/exec';
    var params = new URLSearchParams(location.search);
    var isLocal = /^(localhost|127\.0\.0\.1)$/.test(location.hostname);
    var api = (isLocal && params.get('api')) || RSVP_ENDPOINT;
    var code = (params.get('vendor') || '').trim().toUpperCase();
    // Jarrod and Telicia's own link (?admin=KEY): every panel plus the send desk
    var adminKey = (params.get('admin') || '').trim().toUpperCase();
    var sideFilter = 'all';          // Everyone / Jarrod's / Telicia's, for the send desk and the guest list
    var deskStage = 'invite';        // which message is being sent
    var deskShowDone = false;
    var pending = null;              // a WhatsApp just opened, waiting for "yes, sent"
    var TZ = 'Africa/Johannesburg';
    var app = document.getElementById('app');
    var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
    var data = null;
    var guestFilter = 'all', guestSearch = '';

    function fail(msg) {
        app.innerHTML = '<div class="center"><div><span class="eyebrow">Jarrod &amp; Telicia · 25 · 04 · 2027</span><p>' + msg + '</p></div></div>';
    }

    function load(quiet) {
        if (!code && !adminKey) return fail('This page needs your personal planning link. Please check it with Jarrod or Telicia.');
        return fetch(api + '?action=plan&' + (adminKey ? 'admin=' + encodeURIComponent(adminKey) : 'vendor=' + encodeURIComponent(code)))
            .then(function (r) { return r.json(); })
            .then(function (d) {
                if (!d.ok) return fail('This planning link doesn’t work. Please check it with Jarrod or Telicia.');
                data = d;
                render();
            })
            .catch(function () { if (!quiet) fail('Couldn’t load your planning page. Check your signal and refresh.'); });
    }

    function time(t) { return t ? esc(t) : '<span class="tbc">TBC</span>'; }

    function render() {
        var v = data.vendor;
        var first = v.name.split(' ')[0];
        var sections = [];
        var jump = [];
        var html = '<header class="top"><div class="wrap">' +
            '<span class="eyebrow">Jarrod &amp; Telicia · 25 · 04 · 2027</span>' +
            '<h1>The <em>planning</em> room</h1>' +
            (data.couple
                ? '<p class="hello">Your planning room: send invites and reminders, and see everything your vendors see, live from your sheet.</p><p class="note">Keep this link to yourselves. It shows guests’ phone numbers.</p>'
                : '<p class="hello">Hi ' + esc(first) + (v.role ? ', our ' + esc(v.role.toLowerCase()) : '') + '. Everything you need for the day, live from our own planning sheet.</p>' +
                    (v.note ? '<p class="note">' + esc(v.note) + '</p>' : '') +
                    '<div class="links"><a class="btn btn-solid" href="../?invite=' + encodeURIComponent(v.code) + (isLocal && params.get('api') ? '&api=' + encodeURIComponent(params.get('api')) : '') + '">Wedding website →</a>' +
                    (v.access.indexOf('camera') !== -1 ? '<a class="btn" href="../camera/?invite=' + encodeURIComponent(v.code) + (isLocal && params.get('api') ? '&api=' + encodeURIComponent(params.get('api')) : '') + '">The Darkroom →</a>' : '') + '</div>');

        if (data.desk) {
            jump.push(['desk', 'Send desk']);
            sections.push('<section class="panel" id="desk"><div class="wrap"><span class="eyebrow">Invitations &amp; reminders</span><h2>The send <em>desk</em></h2>' +
                '<p class="lede">Tap a button and WhatsApp opens with the message written and their personal link in it. Press Send in WhatsApp, come back here and confirm, and it’s ticked off.</p>' +
                '<div class="tools" id="deskSides"></div><div class="tools" id="deskStages"></div>' +
                '<div class="stats" id="deskStats"></div>' +
                '<div class="tools"><button class="btn btn-solid" id="deskNext">Send the next one →</button><label class="done-toggle"><input type="checkbox" id="deskDone"' + (deskShowDone ? ' checked' : '') + '> Show ones already done</label></div>' +
                '<ul class="desk" id="deskList"></ul><p class="empty" id="deskEmpty" hidden></p></div></section>');
        }

        if (data.day) {
            jump.push(['day', 'The day']);
            sections.push('<section class="panel" id="day"><div class="wrap"><span class="eyebrow">Running order</span><h2>The <em>day</em></h2>' +
                (data.day.length ? '<table class="list"><thead><tr><th>Time</th><th>Moment</th></tr></thead><tbody>' + data.day.map(function (r) {
                    return '<tr><td class="time">' + time(r.time) + '</td><td>' + esc(r.moment) + (r.notes ? '<small>' + esc(r.notes) + '</small>' : '') + '</td></tr>';
                }).join('') + '</tbody></table>' : '<p class="empty">The running order is still being finalised.</p>') + '</div></section>');
        }
        if (data.music) {
            jump.push(['music', 'Music cues']);
            var chosen = data.music.filter(function (r) { return r.song; }).length;
            sections.push('<section class="panel" id="music"><div class="wrap"><span class="eyebrow">For the DJ · ' + chosen + ' of ' + data.music.length + ' chosen</span><h2>Music <em>cues</em></h2>' +
                '<p class="lede">One song for each moment of the day. Anything still marked “to be chosen” is ours to decide; we’ll fill it in here.</p>' +
                '<table class="list"><thead><tr><th>Time</th><th>Moment</th><th>Song</th></tr></thead><tbody>' + data.music.map(function (r) {
                    return '<tr><td class="time">' + time(r.time) + '</td><td>' + esc(r.moment) + (r.notes ? '<small>' + esc(r.notes) + '</small>' : '') + '</td><td class="song">' +
                        (r.song ? '<b>' + esc(r.song) + '</b>' + (r.artist ? '<small>' + esc(r.artist) + '</small>' : '') : '<span class="tbc">To be chosen</span>') + '</td></tr>';
                }).join('') + '</tbody></table></div></section>');
        }
        if (data.songs) {
            jump.push(['songs', 'Song requests']);
            var s = data.songs;
            sections.push('<section class="panel" id="songs"><div class="wrap"><span class="eyebrow">From our guests · ' + s.requests.length + ' songs</span><h2>Song <em>requests</em></h2>' +
                '<p class="lede">Songs guests added from the wedding website, live. They’re all on our Spotify playlist too.</p>' +
                (s.playlist ? '<div class="links"><a class="btn" href="' + esc(s.playlist) + '" target="_blank" rel="noopener">Open the playlist on Spotify ↗</a></div>' : '') +
                (s.requests.length ? '<ul class="requests">' + s.requests.map(function (r) {
                    var title = '<b>' + esc(r.song) + '</b> <small>· ' + esc(r.artist) + '</small>';
                    return '<li><span>' + (r.link ? '<a href="' + esc(r.link) + '" target="_blank" rel="noopener">' + title + '</a>' : title) + '</span><small>' + esc(r.by) + '</small></li>';
                }).join('') + '</ul>' : '<p class="empty">No song requests yet.</p>') +
                (s.typed.length ? '<span class="eyebrow" style="margin-top:28px">Also asked for on RSVPs</span><ul class="requests">' + s.typed.map(function (t) {
                    return '<li><span>' + esc(t.text) + '</span><small>' + esc(t.invite) + '</small></li>';
                }).join('') + '</ul>' : '') + '</div></section>');
        }
        if (data.tables) {
            jump.push(['tables', 'Table plan']);
            sections.push('<section class="panel" id="tables"><div class="wrap"><span class="eyebrow" id="tablesEyebrow">Who sits where</span><h2>Table <em>plan</em></h2>' +
                (data.couple ? '<p class="lede">Drag a name onto a table (or tap a name, then a table). Drag an invitation’s name to seat the whole household. Everything saves straight away, and your planner sees it live.</p>' : '<p class="lede">Who sits where, live from our plan. Guests in grey haven’t replied yet.</p>') +
                (data.couple ? '<div class="room" id="roomBar"></div>' +
                    '<div class="board" id="board"><aside class="pool" data-drop=""><div class="pool-head"><b>Not seated</b><span id="poolCount"></span></div>' +
                    '<div class="tools tight" id="poolSides"></div><div class="tools tight">' + [['open', 'Everyone'], ['yes', 'Attending'], ['waiting', 'Waiting']].map(function (c) {
                        return '<button class="chip" data-pool="' + c[0] + '">' + c[1] + '</button>';
                    }).join('') + '</div><input type="search" id="poolSearch" placeholder="Find a guest" value="' + esc(poolSearch) + '"><div id="poolList"></div></aside>' +
                    '<div class="tablegrid" id="tableGrid"></div></div>' +

    // ---------- The send desk (couple only) ----------

    // ---------- The table plan ----------
    var seatFilter = 'unseated', seatSearch = '', seatSaving = 0;

    /** Tables with their guests: worked out from the guest list for the couple, so a change shows at once */
    function tableGroups() {
        if (!data.guests || !data.couple) return data.tables.tables;

        var by = {};

    // ---------- The room: number of tables, usual seats, and any bigger or smaller table ----------
    function renderRoom(groups) {

    // The venue's limits come from the sheet (Max Tables, Max Seats Per Table); 16 and 9 if it says nothing

    // ---------- The board: a "Not seated" column, tables as drop zones ----------

        var guests = keys.map(byKey).filter(function (g) { return g && g.table !== table; });
        picked = null;
        if (guests.length) seat(guests, table); else renderTables();
    }
    // Mouse dragging: a light copy of the name follows the pointer; the table under it lights up
    var drag = null;
    function startDrag(e, keys, label) {
        drag = { keys: keys, x: e.clientX, y: e.clientY, live: false, label: label, over: null };
    }
    document.addEventListener('mousemove', function (e) {
        if (!drag) return;
        if (!drag.live) {
            if (Math.abs(e.clientX - drag.x) + Math.abs(e.clientY - drag.y) < 6) return;
            drag.live = true;
            drag.ghost = document.createElement('div');
            drag.ghost.className = 'ghost';
            drag.ghost.textContent = drag.label;
            document.body.appendChild(drag.ghost);
            document.body.classList.add('dragging');
        }
        drag.ghost.style.left = (e.clientX + 12) + 'px';
        drag.ghost.style.top = (e.clientY + 12) + 'px';
        var el = document.elementFromPoint(e.clientX, e.clientY);
        var over = el && el.closest('[data-drop]');
        if (drag.over && drag.over !== over) drag.over.classList.remove('over-drop');
        if (over) over.classList.add('over-drop');
        drag.over = over;
        // Scroll the page when dragging near the top or bottom edge
        if (e.clientY < 70) window.scrollBy(0, -18); else if (e.clientY > window.innerHeight - 70) window.scrollBy(0, 18);
    });
    document.addEventListener('mouseup', function () {
        if (!drag) return;
        var d = drag;
        drag = null;
        if (!d.live) return; // a click, handled as a pick
        d.ghost.remove();
        document.body.classList.remove('dragging');
        if (d.over) { d.over.classList.remove('over-drop'); dropOn(d.over, d.keys); }
    });
    function wireBoard() {
        var board = document.getElementById('board');
        if (!board || board.wired) return;
        board.wired = true;
        board.addEventListener('mousedown', function (e) {
            if (e.button !== 0) return;
            var c = e.target.closest('[data-g]'), h = e.target.closest('[data-inv]');
            if (c) { e.preventDefault(); startDrag(e, [c.getAttribute('data-g')], byKey(c.getAttribute('data-g')).guest); }
            else if (h) { e.preventDefault(); var gs = guestsOfInvite(h.getAttribute('data-inv')); if (gs.length) startDrag(e, gs.map(gKey), h.textContent.trim()); }
        });
        board.addEventListener('click', function (e) {
            if (e.target.closest('.adj')) return;
            var c = e.target.closest('[data-g]'), h = e.target.closest('[data-inv]'), zone = e.target.closest('[data-drop]');
            if (c) { var g = byKey(c.getAttribute('data-g')); pick([g], g.guest); return; }
            if (h) { var gs = guestsOfInvite(h.getAttribute('data-inv')); if (gs.length) pick(gs, h.firstChild.textContent.trim()); return; }
            if (zone && picked) dropOn(zone, picked.keys);
        });
    }
    /** Saves each guest's table; the page updates straight away and puts it back if a save fails */
    function seat(guests, table) {
        guests.forEach(function (g) {
            var before = g.table;
            g.table = table;
            seatSaving++;
            fetch(api, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: 'seatSet', key: adminKey, code: g.code, guest: g.guest, table: table }) })
                .then(function (r) { return r.json(); })
                .then(function (res) { if (!res.ok) throw res; })
                .catch(function () { g.table = before; renderTables(); alert('Couldn’t save ' + g.guest + '’s table. Check your signal and try again.'); })
                .then(function () { seatSaving--; });
        });
        var y = window.scrollY;
        renderTables();
        if (data.guests) renderGuests();
        window.scrollTo(0, y);
    }
    function wireTables() {
        if (data.couple) {
            document.querySelectorAll('[data-pool]').forEach(function (b) {
                b.addEventListener('click', function () { poolFilter = b.getAttribute('data-pool'); renderPool(); });
            });
            var search = document.getElementById('poolSearch');
            search.addEventListener('input', function () { poolSearch = search.value; renderPool(); });
            document.getElementById('pickCancel').addEventListener('click', function () { picked = null; renderTables(); });
            wireBoard();
        }
        renderTables();
    }

    function renderGuests() {
        if (data.couple && document.getElementById('guestSides')) sideChips('guestSides');
        var rows = data.guests.list.filter(guestMatches);
        document.querySelectorAll('[data-filter]').forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-filter') === guestFilter); });
        document.getElementById('guestRows').innerHTML = rows.map(function (x) {
            var cls = x.attending === 'Yes' ? 'yes' : x.attending === 'No' ? 'no' : 'waiting';
            var label = x.attending === 'Yes' ? 'Attending' : x.attending === 'No' ? 'Declined' : 'Waiting';
            return '<tr><td>' + esc(x.guest) + '<small>' + esc(x.invite) + '</small></td><td>' + esc(x.invite) + '</td><td><span class="tag ' + cls + '">' + label + '</span></td><td>' + (x.table ? esc(x.table === 'Main' ? 'Main' : x.table) : '') + '</td><td>' + (x.dietary ? esc(x.dietary) : '') + '</td></tr>';
        }).join('');
        document.getElementById('guestEmpty').hidden = !!rows.length;
    }
    function wireGuests() {
        document.querySelectorAll('[data-filter]').forEach(function (b) {
            b.addEventListener('click', function () { guestFilter = b.getAttribute('data-filter'); renderGuests(); });
        });
        var search = document.getElementById('guestSearch');
        search.addEventListener('input', function () { guestSearch = search.value; renderGuests(); });
        document.getElementById('guestCsv').addEventListener('click', function () {
            var cell = function (s) { return '"' + String(s == null ? '' : s).replace(/"/g, '""') + '"'; };
            var lines = [['Guest', 'Invite', 'Reply', 'Table', 'Dietary']].concat(data.guests.list.filter(guestMatches).map(function (x) {
                return [x.guest, x.invite, x.attending === 'Waiting' ? 'Still to reply' : x.attending, x.table || '', x.dietary];
            })).map(function (r) { return r.map(cell).join(','); });
            var a = document.createElement('a');
            a.href = URL.createObjectURL(new Blob(['﻿' + lines.join('\r\n')], { type: 'text/csv' }));
            a.download = 'Jarrod-Telicia-guest-list.csv';
            document.body.appendChild(a);
            a.click();
            setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
        });
        renderGuests();
    }

    load();
    // Live: quietly refresh every minute while the page is open
    setInterval(function () {
        var typing = document.activeElement && document.activeElement.id === 'guestSearch';
        typing = typing || (document.activeElement && document.activeElement.id === 'poolSearch') || !!picked || !!drag;
        if (!document.hidden && !typing && !pending && !seatSaving) load(true);
    }, 60000);
})();
</script>
